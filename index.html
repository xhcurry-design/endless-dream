<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Endless Dream — 一个可在浏览器中探索的沉浸式 3D 梦境。">
  <meta name="theme-color" content="#0a0d1c">
  <title>Endless Dream</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f2ff;
      --muted: #b9b8cc;
      --line: rgba(255,255,255,.15);
      --mint: #93e8cb;
      --violet: #a99fff;
      --night: #080a17;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--night); }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 17% 20%, rgba(121, 93, 238, .33), transparent 28rem),
        radial-gradient(circle at 82% 77%, rgba(56, 177, 142, .23), transparent 30rem),
        linear-gradient(135deg, #0a0d1c 0%, #16152d 49%, #09121b 100%);
      color: var(--ink);
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stars, .stars::before, .stars::after {
      position: fixed; inset: 0; pointer-events: none; content: "";
      background-image: radial-gradient(rgba(255,255,255,.8) 1px, transparent 1.5px);
      background-size: 73px 73px;
      opacity: .27;
    }
    .stars::before { transform: translate(31px, 47px) scale(.68); opacity: .45; }
    .stars::after { transform: translate(-29px, 19px) scale(1.15); opacity: .18; }
    main { position: relative; width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 58px 0 68px; }
    .eyebrow { margin: 0 0 14px; color: var(--mint); font-size: .74rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 790px; font-size: clamp(3rem, 9vw, 7.5rem); line-height: .9; letter-spacing: -.075em; font-weight: 800; text-wrap: balance; }
    h1 span { color: transparent; background: linear-gradient(100deg, #d7d1ff, #97eacb); -webkit-background-clip: text; background-clip: text; }
    .intro { max-width: 560px; margin: 28px 0 45px; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.17rem); line-height: 1.85; }
    .scene-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .scene-card {
      position: relative; display: flex; min-height: 355px; flex-direction: column; justify-content: flex-end;
      padding: 30px; overflow: hidden; isolation: isolate; border: 1px solid var(--line); border-radius: 24px;
      color: var(--ink); text-decoration: none; background: rgba(12, 15, 34, .53); box-shadow: 0 22px 55px rgba(0, 0, 0, .2);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .scene-card::before { position: absolute; z-index: -1; inset: 0; content: ""; opacity: .86; transition: transform .45s ease, opacity .25s ease; }
    .scene-card.greenhouse::before { background: linear-gradient(145deg, rgba(32, 105, 80, .15), rgba(9, 34, 31, .8)), radial-gradient(circle at 75% 20%, rgba(169, 245, 176, .54), transparent 30%), radial-gradient(circle at 10% 92%, rgba(41, 132, 81, .8), transparent 44%); }
    .scene-card.upside::before { background: linear-gradient(145deg, rgba(121, 100, 225, .15), rgba(27, 16, 69, .83)), radial-gradient(circle at 22% 14%, rgba(219, 188, 255, .55), transparent 27%), radial-gradient(circle at 83% 78%, rgba(71, 65, 184, .8), transparent 42%); }
    .scene-card:hover, .scene-card:focus-visible { transform: translateY(-5px); border-color: rgba(255,255,255,.48); box-shadow: 0 30px 70px rgba(0,0,0,.32); outline: none; }
    .scene-card:hover::before, .scene-card:focus-visible::before { transform: scale(1.08); opacity: 1; }
    .card-index { margin: 0 0 auto; color: rgba(255,255,255,.72); font-size: .78rem; letter-spacing: .15em; }
    h2 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.65rem); letter-spacing: -.05em; }
    .card-description { margin: 0; max-width: 28ch; color: rgba(255,255,255,.76); line-height: 1.65; }
    .enter { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; color: #fff; font-size: .9rem; font-weight: 800; }
    .enter::after { content: "→"; font-size: 1.3em; transition: transform .2s ease; }
    .scene-card:hover .enter::after { transform: translateX(5px); }
    .note { margin: 30px 0 0; color: rgba(255,255,255,.6); font-size: .86rem; line-height: 1.7; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 80px; padding-top: 22px; border-top: 1px solid var(--line); color: rgba(255,255,255,.53); font-size: .78rem; }
    @media (max-width: 680px) { main { width: min(100% - 32px, 560px); padding-top: 40px; } .scene-grid { grid-template-columns: 1fr; } .scene-card { min-height: 290px; padding: 24px; } footer { margin-top: 52px; flex-direction: column; align-items: flex-start; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">Interactive 3D experience</p>
    <h1>Endless <span>Dream</span></h1>
    <p class="intro">步入一场没有尽头的梦。选择一个空间开始探索；建议使用电脑浏览器，并佩戴耳机以获得更完整的沉浸体验。</p>
    <section class="scene-grid" aria-label="选择游戏场景">
      <a class="scene-card greenhouse" href="./greenhouse/" aria-label="进入温室梦境">
        <p class="card-index">01 / SCENE</p>
        <div>
          <h2>Greenhouse</h2>
          <p class="card-description">在生长、光影与植物之间，寻找梦境留下的线索。</p>
          <span class="enter">进入场景</span>
        </div>
      </a>
      <a class="scene-card upside" href="./upside-room/" aria-label="进入倒置房间">
        <p class="card-index">02 / SCENE</p>
        <div>
          <h2>Upside Room</h2>
          <p class="card-description">当重力失去方向，房间会以另一种方式回应你的脚步。</p>
          <span class="enter">进入场景</span>
        </div>
      </a>
    </section>
    <p class="note">首次进入时，浏览器需要加载 3D 模型与场景资源，请稍候片刻。</p>
    <footer><span>© Endless Dream</span><span>Explore at your own pace.</span></footer>
  </main>
</body>
</html>
