                }

                if (assets.collisionMesh.resource) {
                    collisionMeshEntity = createCollisionMeshEntity(assets.collisionMesh, SCENE_CONFIG);
                    console.log(`✅ 碰撞网格可视化 (${SCENE_CONFIG.colliderFile}) 已就绪`);
                } else {
                    console.warn('⚠️ 碰撞网格加载失败（仅影响可视化，不影响碰撞）');
                }

                // ========== 加载体素碰撞数据（splat-transform 输出的稀疏八叉树）==========
                updateLoading('加载体素碰撞数据...');

                let voxelCollision = null;         // VoxelCollision 实例，场景碰撞的唯一权威数据源

                function assertCollisionMatchesScene(collision) {
                    const assetMeta = collision?.meta?.asset;
                    const transform = assetMeta?.gameSplatTransform;
                    const nearlyEqual = (a, b) => Number.isFinite(a) && Number.isFinite(b) &&
                        Math.abs(a - b) <= 1e-6;
                    const sameArray = (actual, expected) =>
                        Array.isArray(actual) && Array.isArray(expected) &&
                        actual.length >= expected.length &&
                        expected.every((value, index) => nearlyEqual(actual[index], value));

                    if (!assetMeta || assetMeta.surfaceOccupancy !== true ||
                        assetMeta.capsuleCarve !== false) {
                        throw new Error('体素碰撞缺少表面占用数据契约');
                    }
                    if (!sameArray(transform?.position, SCENE_CONFIG.splatPosition) ||
                        !sameArray(transform?.quaternionXyzw, SCENE_CONFIG.splatQuaternion) ||
                        !nearlyEqual(transform?.scale, SCENE_CONFIG.splatScale)) {
                        throw new Error('体素碰撞与当前高斯场景变换不一致，请重新生成碰撞资产');
                    }
                    const expectedVisual = String(SCENE_CONFIG.sourceVisualSha256 || '').toUpperCase();
                    const actualVisual = String(assetMeta.sourceVisualSha256 || '').toUpperCase();
                    if (expectedVisual && actualVisual !== expectedVisual) {
                        throw new Error('体素碰撞与当前高斯场景来源不一致');
                    }
                }

                if (SCENE_CONFIG.voxelFile) {
                    try {
                        voxelCollision = await loadVoxelCollision(SCENE_CONFIG.voxelFile, {
                            frame: SCENE_CONFIG.collisionFrame
                        });
                        assertCollisionMatchesScene(voxelCollision);
                        console.log('✅ 体素碰撞已加载:', voxelCollision.describe());
                    } catch (e) {
                        console.error('❌ 体素碰撞加载或场景契约校验失败:', e);
                        throw e;
                    }
                } else {
                    console.warn('⚠️ 本场景未配置体素碰撞数据（data-voxel），请用 tools\\generate_room_collision.py 重建');
                }

                // 摆放道具 / 可推木箱 / 跑步机等动态物体的碰撞三角形（与场景体素碰撞相互独立）
                let propCollisionTriangles = [];
                let sceneCameraBounds = {
                    valid: false,
                    minX: 0, maxX: 0, minY: 0, maxY: 0, minZ: 0, maxZ: 0,
                    pad: 0.5, splatMargin: 0.65, circExtraInset: 0.42,
                    edgeLookMargin: 0.64, edgeLookPerMeter: 0.30, edgeLookFovScale: 0.28,
                    camCircValid: false, camCircCx: 0, camCircCz: 0, camCircR: 0,
                    maxCameraDistance: 10, minCameraDistance: 0.5,
                    maxPitchDeg: 60, minPitchDeg: -10
                };
                const tmpWorldSplatAabb = new pc.BoundingBox();
                function getSceneCameraFov() {
                    return Number.isFinite(SCENE_CONFIG.cameraFov) ? SCENE_CONFIG.cameraFov : 75;
                }

                function recomputeSceneCameraBounds() {
                    sceneCameraBounds.camCircValid = false;
                    sceneCameraBounds.pad = Number.isFinite(SCENE_CONFIG.cameraBoundsPadding)
                        ? Math.max(0.05, SCENE_CONFIG.cameraBoundsPadding)
                        : 0.5;
                    let minX = Infinity;
                    let maxX = -Infinity;
                    let minY = Infinity;
                    let maxY = -Infinity;
                    let minZ = Infinity;
                    let maxZ = -Infinity;
                    // 场景边界直接取与视觉场景同一变换生成的体素世界包围盒。
                    if (voxelCollision) {
                        const vb = voxelCollision.getWorldBounds();
                        minX = Math.min(minX, vb.min[0]);
                        maxX = Math.max(maxX, vb.max[0]);
                        minY = Math.min(minY, vb.min[1]);
                        maxY = Math.max(maxY, vb.max[1]);
                        minZ = Math.min(minZ, vb.min[2]);
                        maxZ = Math.max(maxZ, vb.max[2]);
                    }
                    for (const tri of propCollisionTriangles) {
                        for (const v of [tri.v0, tri.v1, tri.v2]) {
                            minX = Math.min(minX, v.x);
                            maxX = Math.max(maxX, v.x);
                            minY = Math.min(minY, v.y);
                            maxY = Math.max(maxY, v.y);
                            minZ = Math.min(minZ, v.z);
                            maxZ = Math.max(maxZ, v.z);
                        }
                    }
                    const gsplatComp = splatEntity?.gsplat;
                    const localSplatAabb = gsplatComp?.customAabb;
                    if (localSplatAabb && !voxelCollision && SCENE_CONFIG.cameraBoundsMode !== 'voxel-box') {
                        const sm = sceneCameraBounds.splatMargin;
                        tmpWorldSplatAabb.setFromTransformedAabb(localSplatAabb, splatEntity.getWorldTransform());
                        const c = tmpWorldSplatAabb.center;
                        const h = tmpWorldSplatAabb.halfExtents;
                        minX = Math.min(minX, c.x - h.x - sm);
                        maxX = Math.max(maxX, c.x + h.x + sm);
                        minY = Math.min(minY, c.y - h.y - sm);
                        maxY = Math.max(maxY, c.y + h.y + sm);
                        minZ = Math.min(minZ, c.z - h.z - sm);
                        maxZ = Math.max(maxZ, c.z + h.z + sm);
                        const circInset = sceneCameraBounds.pad + sm + sceneCameraBounds.circExtraInset;
                        const r = Math.min(h.x, h.z) - circInset;
                        if (r > 0.12) {
                            sceneCameraBounds.camCircValid = true;
                            sceneCameraBounds.camCircCx = c.x;
                            sceneCameraBounds.camCircCz = c.z;
                            sceneCameraBounds.camCircR = r;
                        }
                    }
                    if (!Number.isFinite(minX) || minX >= maxX || minZ >= maxZ || minY > maxY) {
                        sceneCameraBounds.valid = false;
                        sceneCameraBounds.camCircValid = false;
                        return;
                    }
                    sceneCameraBounds.minX = minX;
                    sceneCameraBounds.maxX = maxX;
                    sceneCameraBounds.minY = minY;
                    sceneCameraBounds.maxY = maxY;
                    sceneCameraBounds.minZ = minZ;
                    sceneCameraBounds.maxZ = maxZ;
                    sceneCameraBounds.valid = true;
                    const spanH = Math.max(0.01, Math.min(maxX - minX, maxZ - minZ));
                    let maxD = Math.min(6, Math.max(0.85, spanH * 0.22));
                    if (sceneCameraBounds.camCircValid) {
                        maxD = Math.min(maxD, Math.max(0.85, sceneCameraBounds.camCircR * 0.28));
                        sceneCameraBounds.maxPitchDeg = 32;
                        sceneCameraBounds.minPitchDeg = 8;
                        sceneCameraBounds.minCameraDistance = Math.max(0.88, Math.min(1.85, sceneCameraBounds.camCircR * 0.125));
                    } else {
                        sceneCameraBounds.maxPitchDeg = 60;
                        sceneCameraBounds.minPitchDeg = -10;
                        sceneCameraBounds.minCameraDistance = 0.5;
                    }
                    if (Number.isFinite(SCENE_CONFIG.cameraDistanceMax)) {
                        maxD = Math.max(0.55, SCENE_CONFIG.cameraDistanceMax);
                    }
                    if (Number.isFinite(SCENE_CONFIG.cameraDistanceMin)) {
                        sceneCameraBounds.minCameraDistance = Math.max(0.35, SCENE_CONFIG.cameraDistanceMin);
                    }
                    if (Number.isFinite(SCENE_CONFIG.cameraPitchMin)) {
                        sceneCameraBounds.minPitchDeg = SCENE_CONFIG.cameraPitchMin;
                    }
                    if (Number.isFinite(SCENE_CONFIG.cameraPitchMax)) {
                        sceneCameraBounds.maxPitchDeg = SCENE_CONFIG.cameraPitchMax;
                    }
                    sceneCameraBounds.maxCameraDistance = maxD;
                    if (sceneCameraBounds.camCircValid && sceneCameraBounds.minCameraDistance > sceneCameraBounds.maxCameraDistance - 0.12) {
                        sceneCameraBounds.minCameraDistance = Math.max(0.55, sceneCameraBounds.maxCameraDistance - 0.12);
                    }
                    console.log(`📷 相机软边界 AABB: X[${minX.toFixed(2)}, ${maxX.toFixed(2)}] Y[${minY.toFixed(2)}, ${maxY.toFixed(2)}] Z[${minZ.toFixed(2)}, ${maxZ.toFixed(2)}] | 最大距离≈${maxD.toFixed(2)} 圆裁剪=${sceneCameraBounds.camCircValid}`);
                }

                function clampCameraPositionToScene(px, py, pz, orbitDistance = 0) {
                    if (!sceneCameraBounds.valid) {
                        return { x: px, y: py, z: pz };
                    }
                    const b = sceneCameraBounds;
                    const pad = b.pad;
                    let minX = b.minX + pad;
                    let maxX = b.maxX - pad;
                    let minZ = b.minZ + pad;
                    let maxZ = b.maxZ - pad;
                    if (minX > maxX) {
                        const cx = (b.minX + b.maxX) * 0.5;
                        minX = maxX = cx;
                    }
                    if (minZ > maxZ) {
                        const cz = (b.minZ + b.maxZ) * 0.5;
                        minZ = maxZ = cz;
                    }
                    const spanY = Math.max(0.5, b.maxY - b.minY);
                    let yLo = b.minY - 0.35;
                    let yHi = b.maxY + Math.min(14, spanY * 0.85 + 6);
                    if (b.camCircValid) {
                        yLo = b.minY + 0.18;
                        yHi = b.maxY + Math.min(2.45, spanY * 0.26 + 0.85);
                    }
                    if (SCENE_CONFIG.id === 'room') {
                        yLo = b.minY + pad;
                        yHi = b.maxY - pad;
                    }
                    let x = pc.math.clamp(px, minX, maxX);
                    let z = pc.math.clamp(pz, minZ, maxZ);
                    if (b.camCircValid && b.camCircR > 0) {
                        const dx = x - b.camCircCx;
                        const dz = z - b.camCircCz;
                        const len = Math.sqrt(dx * dx + dz * dz);
                        let inward = b.edgeLookMargin + orbitDistance * b.edgeLookPerMeter;
                        if (orbitDistance > 0 && camera && camera.camera && camera.camera.fov != null) {
                            const halfFov = camera.camera.fov * Math.PI / 360;
                            inward += orbitDistance * Math.tan(halfFov) * b.edgeLookFovScale;
                        }
                        inward = Math.min(inward, b.camCircR * 0.52);
                        const rEff = Math.max(0.06, b.camCircR - inward);
                        if (len > rEff && len > 1e-6) {
                            const s = rEff / len;
                            x = b.camCircCx + dx * s;
                            z = b.camCircCz + dz * s;
                        }
                    }
                    return {
                        x,
                        y: pc.math.clamp(py, yLo, yHi),
                        z
                    };
                }
                
                // 场景碰撞已完全由 splat-transform 生成的体素八叉树接管：
                // 既不需要手工对齐参数（旧方案的 posX/posY/posZ/rotY/scale 魔法数字），
                // 也不需要在 CPU 端逐帧遍历数万个碰撞三角形。
                recomputeSceneCameraBounds();

                // ========== 碰撞系统 ==========
                let collisionEnabled = true;
                let splatVisible = true;  // 高斯场景可视化开关
                
                // ========== 角色碰撞体参数（用于可视化） ==========
                let characterColliderVisible = false;
                let characterColliderEntity = null;
                let characterFootEntity = null;
                
                // 体素保存碰撞表面；运行时胶囊尺寸可以独立调节。
                let { radius: characterRadius, height: characterHeight } = getSceneCharacterCapsule(SCENE_CONFIG);
                const characterColliderConfig = {
                    offsetX: 0,
                    offsetY: 0,
                    offsetZ: 0,
                    width: characterRadius,
                    height: characterHeight,
                    depth: characterRadius
                };

                function syncCharacterColliderDimensions() {
                    characterColliderConfig.width = characterRadius;
                    characterColliderConfig.height = characterHeight;
                    characterColliderConfig.depth = characterRadius;
                    characterColliderEntity?.setLocalScale(
                        characterRadius * 2,
                        characterHeight,
                        characterRadius * 2
                    );
                }

                /** 轴对齐盒 12 三角补碰撞（部分 GLB 无 render 或 mesh 未就绪时用） */
                function appendAxisAlignedBoxCollisionTris(cx, cy, cz, hx, hy, hz, ownerEntity, stompOwnerEntity = ownerEntity) {
                    const x0 = cx - hx;
                    const x1 = cx + hx;
                    const y0 = cy - hy;
                    const y1 = cy + hy;
                    const z0 = cz - hz;
                    const z1 = cz + hz;
                    const owner = ownerEntity || null;
                    const stomp = stompOwnerEntity || null;
                    let c = 0;
                    const push = (ax, ay, az, bx, by, bz, tcx, tcy, tcz) => {
                        propCollisionTriangles.push({
                            v0: new pc.Vec3(ax, ay, az),
                            v1: new pc.Vec3(bx, by, bz),
                            v2: new pc.Vec3(tcx, tcy, tcz),
                            owner,
                            stompOwner: stomp
                        });
                        c++;
                    };
                    push(x0, y1, z0, x0, y1, z1, x1, y1, z1);
                    push(x0, y1, z0, x1, y1, z1, x1, y1, z0);
                    push(x0, y0, z0, x1, y0, z1, x0, y0, z1);
                    push(x0, y0, z0, x1, y0, z0, x1, y0, z1);
                    push(x0, y0, z1, x1, y0, z1, x1, y1, z1);
                    push(x0, y0, z1, x1, y1, z1, x0, y1, z1);
                    push(x1, y0, z0, x0, y0, z0, x0, y1, z0);
                    push(x1, y0, z0, x0, y1, z0, x1, y1, z0);
                    push(x1, y0, z0, x1, y0, z1, x1, y1, z1);
                    push(x1, y0, z0, x1, y1, z1, x1, y1, z0);
                    push(x0, y0, z1, x0, y0, z0, x0, y1, z0);
                    push(x0, y0, z1, x0, y1, z0, x0, y1, z1);
                    return c;
                }

                /** findComponents + 手动子树遍历，兼容不同版本引擎；去重同一 component */
                function collectRenderModelComponentsUnder(rootEnt) {
                    const set = new Set();
                    if (rootEnt.findComponents) {
                        rootEnt.findComponents('render').forEach((c) => { if (c) set.add(c); });
                        rootEnt.findComponents('model').forEach((c) => { if (c) set.add(c); });
                    }
                    function walk(ent) {
                        try {
                            if (ent.render) set.add(ent.render);
                            if (ent.model) set.add(ent.model);
                        } catch (e) { /* ignore */ }
                        const ch = ent.children;
                        for (let i = 0; i < ch.length; i++) walk(ch[i]);
                    }
                    walk(rootEnt);
                    return Array.from(set);
                }

                /** 将子树下 render / model 的 mesh 三角变换到世界坐标并追加；stompOwner 供踩踏消灭 */
                function appendWorldMeshTrianglesFromRenderRoot(renderRoot, label, ownerEntity, stompOwnerEntity = ownerEntity) {
                    let triCount = 0;
                    const owner = ownerEntity || null;
                    const stomp = stompOwnerEntity || null;
                    function addTrisFromMesh(mesh, worldMat) {
                        if (!mesh) return;
                        const positions = [];
                        mesh.getPositions(positions);
                        if (positions.length < 9) return;
                        const indices = [];
                        mesh.getIndices(indices);
                        const addTri = (ia, ib, ic) => {
                            const oa = ia * 3;
                            const ob = ib * 3;
                            const oc = ic * 3;
                            const v0 = new pc.Vec3(positions[oa], positions[oa + 1], positions[oa + 2]);
                            const v1 = new pc.Vec3(positions[ob], positions[ob + 1], positions[ob + 2]);
                            const v2 = new pc.Vec3(positions[oc], positions[oc + 1], positions[oc + 2]);
                            worldMat.transformPoint(v0, v0);
                            worldMat.transformPoint(v1, v1);
                            worldMat.transformPoint(v2, v2);
                            propCollisionTriangles.push({ v0, v1, v2, owner, stompOwner: stomp });
                            triCount++;
                        };
                        if (indices.length >= 3) {
                            for (let i = 0; i < indices.length; i += 3) {
                                addTri(indices[i], indices[i + 1], indices[i + 2]);
                            }
                        } else {
                            const nV = Math.floor(positions.length / 3);
                            for (let i = 0; i + 2 < nV; i += 3) {
                                addTri(i, i + 1, i + 2);
                            }
                        }
                    }
                    function addFromComponent(comp) {
                        if (!comp || !comp.meshInstances || !comp.meshInstances.length) return;
                        const hostEntity = comp.entity;
                        for (let mi = 0; mi < comp.meshInstances.length; mi++) {
                            const inst = comp.meshInstances[mi];
                            const mesh = inst.mesh;
                            const graphNode = inst.node || hostEntity;
                            if (!graphNode || !graphNode.getWorldTransform) continue;
                            const skinned = !!(mesh && mesh.skin) || !!inst.skinInstance;
                            const wbox = inst.aabb;
                            if (skinned) {
                                if (wbox && wbox.halfExtents) {
                                    const hx = Math.max(0.04, wbox.halfExtents.x);
                                    const hy = Math.max(0.04, wbox.halfExtents.y);
                                    const hz = Math.max(0.04, wbox.halfExtents.z);
                                    triCount += appendAxisAlignedBoxCollisionTris(
                                        wbox.center.x, wbox.center.y, wbox.center.z,
                                        hx, hy, hz,
                                        owner,
                                        stomp
                                    );
                                }
                                continue;
                            }
                            if (!mesh) continue;
                            const t0 = triCount;
                            addTrisFromMesh(mesh, graphNode.getWorldTransform());
                            if (triCount === t0 && wbox && wbox.halfExtents) {
                                const hx = Math.max(0.04, wbox.halfExtents.x);
                                const hy = Math.max(0.04, wbox.halfExtents.y);
                                const hz = Math.max(0.04, wbox.halfExtents.z);
                                triCount += appendAxisAlignedBoxCollisionTris(
                                    wbox.center.x, wbox.center.y, wbox.center.z,
                                    hx, hy, hz,
                                    owner,
                                    stomp
                                );
                            }
                        }
                    }
                    const comps = collectRenderModelComponentsUnder(renderRoot);
                    for (let ci = 0; ci < comps.length; ci++) addFromComponent(comps[ci]);
                    if (label) {
                        console.log(`🧱 ${label} 网格碰撞: 追加 ${triCount} 个三角形（${comps.length} 个 render/model 组件）`);
                    }
                    return triCount;
                }

                // 场景碰撞完全来自体素八叉树，不再需要手工摆放的补充碰撞盒。
                recomputeSceneCameraBounds();

                // ========== 碰撞检测（场景 = 体素八叉树，动态道具 = 三角形）==========
                // 房间使用 1.20/0.15，其余场景使用 1.40/0.25；切换时会同步更新。

                // 2.5cm 体素下允许跨越小门槛，但床与窗台仍必须通过跳跃抵达。
                const GROUND_MAX_STEP_UP = 0.16;
                const GROUND_MAX_STEP_DOWN = 0.24;
                const GROUND_SUPPORT_DROP = 0.14;
                const GROUND_SKIN = 0.015;
                const GROUND_SUPPORT_RADIUS = Math.min(characterRadius * 0.45, 0.10);
                const GROUND_LOCAL_RELIEF_RADIUS = Math.min(characterRadius * 0.8, 0.18);
                const GROUND_MAX_LOCAL_RELIEF = 0.10;
                
                // 重力系统
                let velocityY = 0;             // 垂直速度
                const gravity = -14;
                const groundY = -50;            // 安全底线（远低于场景，只防止掉出世界）
                let isGrounded = false;        // 是否在地面上
                
                // 跳跃参数
                const jumpForce = 4.5;
                const STOMP_MIN_DOWN_VEL = -0.35;  // 非跳跃时下落速度阈值（略放宽，避免落地帧速度过小）
                const STOMP_BOUNCE_VEL = 3.2;
                let isJumping = false;         // 是否正在跳跃中
                let positionLocked = false;    // L键锁定位置，防止下落
                
                // 点到三角形的最近距离（2D投影，用于XZ平面碰撞）
                // 改进版：真正计算点到三角形边的距离
                function pointToTriangleDistXZ(px, pz, v0, v1, v2) {
                    // 检查点是否在三角形内部
                    function sign(p1x, p1z, p2x, p2z, p3x, p3z) {
                        return (p1x - p3x) * (p2z - p3z) - (p2x - p3x) * (p1z - p3z);
                    }
                    
                    const d1 = sign(px, pz, v0.x, v0.z, v1.x, v1.z);
                    const d2 = sign(px, pz, v1.x, v1.z, v2.x, v2.z);
                    const d3 = sign(px, pz, v2.x, v2.z, v0.x, v0.z);
                    
                    const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
                    const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
                    
                    // 点在三角形内部
                    if (!(hasNeg && hasPos)) {
                        return 0;
                    }
                    
                    // 点在三角形外部，计算到三条边的最近距离
                    function pointToSegmentDistSq(px, pz, ax, az, bx, bz) {
                        const abx = bx - ax, abz = bz - az;
                        const apx = px - ax, apz = pz - az;
                        const t = Math.max(0, Math.min(1, (apx * abx + apz * abz) / (abx * abx + abz * abz + 0.0001)));
                        const closestX = ax + t * abx;
                        const closestZ = az + t * abz;
                        const dx = px - closestX, dz = pz - closestZ;
                        return dx * dx + dz * dz;
                    }
                    
                    const d01 = pointToSegmentDistSq(px, pz, v0.x, v0.z, v1.x, v1.z);
                    const d12 = pointToSegmentDistSq(px, pz, v1.x, v1.z, v2.x, v2.z);
                    const d20 = pointToSegmentDistSq(px, pz, v2.x, v2.z, v0.x, v0.z);
                    
                    return Math.sqrt(Math.min(d01, d12, d20));
                }

                function pointToSegmentDistXZ(px, pz, ax, az, bx, bz) {
                    const abx = bx - ax, abz = bz - az;
                    const apx = px - ax, apz = pz - az;
                    const t = Math.max(0, Math.min(1, (apx * abx + apz * abz) / (abx * abx + abz * abz + 1e-10)));
                    const cx = ax + t * abx, cz = az + t * abz;
                    const dx = px - cx, dz = pz - cz;
                    return Math.sqrt(dx * dx + dz * dz);
                }

                function pointToTriangleDistXZRobust(px, pz, v0, v1, v2) {
                    const e1x = v1.x - v0.x, e1z = v1.z - v0.z;
                    const e2x = v2.x - v0.x, e2z = v2.z - v0.z;
                    const cross = e1x * e2z - e1z * e2x;
                    if (Math.abs(cross) < 1e-12) {
                        return Math.min(
                            pointToSegmentDistXZ(px, pz, v0.x, v0.z, v1.x, v1.z),
                            pointToSegmentDistXZ(px, pz, v1.x, v1.z, v2.x, v2.z),
                            pointToSegmentDistXZ(px, pz, v2.x, v2.z, v0.x, v0.z)
                        );
                    }
                    return pointToTriangleDistXZ(px, pz, v0, v1, v2);
                }
                
                /**
                 * 判定角色胶囊体在目标位置是否受阻。
                 * 场景部分改由体素八叉树判定（它已经是“可行走空间”，网格外即实心），
                 * 摆放道具 / 木箱 / 跑步机仍沿用原有的三角形判定以保留玩法。
                 */
                function checkCollisionXZ(posX, posY, posZ, ignoreOwners) {
                    // 1) 场景碰撞：体素胶囊体查询
                    if (voxelCollision &&
                        voxelCollision.isCapsuleBlocked(posX, posY, posZ, characterRadius, characterHeight)) {
                        return true;
                    }

                    // 2) 动态道具碰撞：保留原有三角形逻辑
                    const wallThreshold = 0.7;  // 法线Y分量小于此值视为墙壁
                    const ignoreSet = ignoreOwners instanceof Set
                        ? ignoreOwners
                        : (ignoreOwners ? new Set([ignoreOwners]) : null);

                    for (const tri of propCollisionTriangles) {
                        if (ignoreSet && tri.owner && ignoreSet.has(tri.owner)) continue;
                        const { v0, v1, v2 } = tri;

                        const e1x = v1.x - v0.x, e1y = v1.y - v0.y, e1z = v1.z - v0.z;
                        const e2x = v2.x - v0.x, e2y = v2.y - v0.y, e2z = v2.z - v0.z;
                        const nx = e1y * e2z - e1z * e2y;
                        const ny = e1z * e2x - e1x * e2z;
                        const nz = e1x * e2y - e1y * e2x;
                        const nLen = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        if (nLen < 0.0001) continue;

                        if (Math.abs(ny / nLen) > wallThreshold) continue;

                        const triMinY = Math.min(v0.y, v1.y, v2.y);
                        const triMaxY = Math.max(v0.y, v1.y, v2.y);
                        const charBottom = posY + 0.1;
                        const charTop = posY + characterHeight - 0.1;

                        if (charBottom > triMaxY || charTop < triMinY) continue;

                        if (pointToTriangleDistXZRobust(posX, posZ, v0, v1, v2) < characterRadius) {
                            return true;
                        }
                    }

                    return false;
                }

                /**
                 * 胶囊体水平扫掩式推进（连续碰撞检测，CCD）。
                 *
                 * 旧方案只判定“目标点”是否撞墙，一旦帧率下降或速度偏大就直接跳过薄墙；
                 * 现在将位移切成不超过半个体素的小步逐步推进，物理上不可能跳过任何一层墙；
                 * 遇阻时依次尝试单轴滑动，保留贴墙滑行的手感。
                 *
                 * @returns {{x:number, z:number, hit:boolean}} 本帧最终可到达的水平位置
                 */
                function sweepCharacterXZ(fromX, posY, fromZ, toX, toZ, ignoreOwners) {
                    const dx = toX - fromX;
                    const dz = toZ - fromZ;
                    const dist = Math.hypot(dx, dz);
                    if (dist < 1e-9) return { x: fromX, z: fromZ, hit: false };

                    // 每一步不超过半个体素（无体素数据时退化为 4cm）。
                    const res = voxelCollision ? voxelCollision.res : 0.08;
                    const minStep = res * 0.5;

                    let hit = false;

                    /**
                     * 在一条线段上尽可能推进，返回能到达的最远自由位置。
                     * 全程以不超过半个体素的小步推进，首次受阻后再二分细化接触点。
                     */
                    function seg(ax, az, bx, bz) {
                        const len = Math.hypot(bx - ax, bz - az);
                        if (len < 1e-9) return { x: ax, z: az, done: true };

                        const steps = Math.max(1, Math.ceil(len / minStep));
                        let freeX = ax, freeZ = az;
                        for (let i = 1; i <= steps; i++) {
                            const blockedX = ax + (bx - ax) * (i / steps);
                            const blockedZ = az + (bz - az) * (i / steps);
                            if (!checkCollisionXZ(blockedX, posY, blockedZ, ignoreOwners)) {
                                freeX = blockedX;
                                freeZ = blockedZ;
                                continue;
                            }
                            let loX = freeX, loZ = freeZ;
                            let hiX = blockedX, hiZ = blockedZ;
                            for (let k = 0; k < 10; k++) {
                                const midX = (loX + hiX) * 0.5;
                                const midZ = (loZ + hiZ) * 0.5;
                                if (checkCollisionXZ(midX, posY, midZ, ignoreOwners)) {
                                    hiX = midX;
                                    hiZ = midZ;
                                } else {
                                    loX = midX;
                                    loZ = midZ;
                                }
                            }
                            return { x: loX, z: loZ, done: false };
                        }
                        return { x: bx, z: bz, done: true };
                    }

                    let curX = fromX;
                    let curZ = fromZ;

                    const adv = seg(curX, curZ, toX, toZ);
                    curX = adv.x;
                    curZ = adv.z;

                    if (!adv.done) {
                        hit = true;
                        const sX = seg(curX, curZ, toX, curZ);
                        const sZ = seg(curX, curZ, curX, toZ);
                        const gainX = Math.abs(sX.x - curX);
                        const gainZ = Math.abs(sZ.z - curZ);

                        if (gainX >= gainZ && gainX > 1e-9) {
                            curX = sX.x;
                        } else if (gainZ > 1e-9) {
                            curZ = sZ.z;
                        }
                    }

                    return { x: curX, z: curZ, hit };
                }

                /**
                 * 着地状态的贴地水平扫掠：每个 CCD 子步都重新求地面高度，
                 * 并在新脚底位置复核完整胶囊净空。跳跃状态仍使用上面的固定 Y
                 * 扫掠，避免在空中错误吸附到场景表面。
                 */
                function sweepCharacterGrounded(fromX, fromY, fromZ, toX, toZ, ignoreOwners) {
                    if (!collisionEnabled) {
                        return { x: fromX, y: fromY, z: fromZ, hit: false, grounded: true };
                    }
                    if (!voxelCollision) {
                        const fallback = sweepCharacterXZ(
                            fromX, fromY, fromZ, toX, toZ, ignoreOwners
                        );
                        return {
                            x: fallback.x,
                            y: fromY,
                            z: fallback.z,
                            hit: fallback.hit,
                            grounded: true,
                            reason: fallback.hit ? 'blocked' : ''
                        };
                    }
                    const result = voxelCollision.sweepCapsuleGrounded(
                        fromX, fromY, fromZ, toX, toZ,
                        characterRadius, characterHeight,
                        {
                            maxStepUp: GROUND_MAX_STEP_UP,
                            maxStepDown: GROUND_MAX_STEP_DOWN,
                            supportDrop: GROUND_SUPPORT_DROP,
                            skin: GROUND_SKIN,
                            localReliefRadius: GROUND_LOCAL_RELIEF_RADIUS,
                            maxLocalRelief: GROUND_MAX_LOCAL_RELIEF,
                            // 中心与脚底周边共同确认支撑，避免在体素边沿来回选面。
                            supportRadius: GROUND_SUPPORT_RADIUS,
                            groundHeightAt: (x, z, top, drop) => {
                                const q = getGroundQuery(x, z, top, ignoreOwners, drop);
                                return q.y > groundY + GROUND_SKIN ? q.y : null;
                            },
                            isBlocked: (x, y, z) => checkCollisionXZ(x, y, z, ignoreOwners)
                        }
                    );
                    return result;
                }

                function getContinuousGroundY(posX, posY, posZ, ignoreOwners) {
                    if (!voxelCollision) return null;
                    return voxelCollision.groundedFootHeightAt(
                        posX, posZ, posY, characterRadius, characterHeight,
                        {
                            maxStepUp: GROUND_MAX_STEP_UP,
                            maxStepDown: GROUND_MAX_STEP_DOWN,
                            supportDrop: GROUND_SUPPORT_DROP,
                            skin: GROUND_SKIN,
                            supportRadius: GROUND_SUPPORT_RADIUS,
                            localReliefRadius: GROUND_LOCAL_RELIEF_RADIUS,
                            maxLocalRelief: GROUND_MAX_LOCAL_RELIEF,
                            groundHeightAt: (x, z, top, drop) => {
                                const q = getGroundQuery(x, z, top, ignoreOwners, drop);
                                return q.y > groundY + GROUND_SKIN ? q.y : null;
                            },
                            isBlocked: (x, y, z) => checkCollisionXZ(x, y, z, ignoreOwners)
                        }
                    );
                }

                /**
                 * 胶囊体垂直连续碰撞检测。体素运行时会以不超过半个体素的步长推进，
                 * 因而低帧率下也不会从薄顶棚或薄地板的一侧跳到另一侧。
                 */
                function sweepCharacterY(posX, fromY, posZ, toY) {
                    if (!collisionEnabled || !voxelCollision) {
                        return { y: toY, hit: false, startedBlocked: false };
                    }
                    return voxelCollision.sweepCapsuleY(
                        posX, fromY, posZ, toY, characterRadius, characterHeight
                    );
                }

                /** 着地吸附前复核完整胶囊净空；动态道具顶面仍由地面查询负责。 */
                function canSnapToGround(posX, posY, posZ, ignoreOwners) {
                    return !collisionEnabled || !checkCollisionXZ(posX, posY, posZ, ignoreOwners);
                }

                /** 仅在 skin 范围内原地向上恢复，不改变 XZ，也不会跨过墙体。 */
                function recoverCharacterFootWithinSkin(posX, posY, posZ, ignoreOwners) {
                    if (!checkCollisionXZ(posX, posY, posZ, ignoreOwners)) return posY;
                    const highY = posY + GROUND_SKIN;
                    if (checkCollisionXZ(posX, highY, posZ, ignoreOwners)) return null;
                    let low = posY;
                    let high = highY;
                    for (let i = 0; i < 12; i++) {
                        const mid = (low + high) * 0.5;
                        if (checkCollisionXZ(posX, mid, posZ, ignoreOwners)) low = mid;
                        else high = mid;
                    }
                    return high;
                }

                /** 只允许落到脚底在本帧由上向下实际跨越的表面。 */
                function crossedGroundThisFrame(oldY, reachedY, surfaceY, epsilon) {
                    return reachedY <= oldY &&
                        surfaceY > groundY + epsilon &&
                        surfaceY <= oldY + epsilon &&
                        surfaceY >= reachedY - epsilon;
                }
                 
                // 检测脚下地面高度（用于重力）
                // 找角色脚下最近的可站立表面（法线朝上）
                // searchMaxY: 搜索上限，只查找不高于此值的面
                // stompOwner: 若着地面来自摆放道具网格，则为该道具根实体（用于马里奥式踩踏）
                function getGroundQuery(posX, posZ, searchMaxY, ignoreOwners, maxDrop = 60) {
                    let groundHeight = -Infinity;
                    let stompOwner = null;
                    const groundSearchDrop = Number.isFinite(maxDrop)
                        ? Math.max(0, maxDrop)
                        : 60;
                    const searchMinY = searchMaxY - groundSearchDrop;
                    const ignoreSet = ignoreOwners instanceof Set
                        ? ignoreOwners
                        : (ignoreOwners ? new Set([ignoreOwners]) : null);
                    
                    function pointInTriangleXZ(px, pz, v0, v1, v2) {
                        const d1 = (px - v1.x) * (v0.z - v1.z) - (v0.x - v1.x) * (pz - v1.z);
                        const d2 = (px - v2.x) * (v1.z - v2.z) - (v1.x - v2.x) * (pz - v2.z);
                        const d3 = (px - v0.x) * (v2.z - v0.z) - (v2.x - v0.x) * (pz - v0.z);
                        const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
                        const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
                        return !(hasNeg && hasPos);
                    }
                    
                    function getTriangleYAt(px, pz, v0, v1, v2) {
                        const denom = (v1.z - v2.z) * (v0.x - v2.x) + (v2.x - v1.x) * (v0.z - v2.z);
                        if (Math.abs(denom) < 0.0001) {
                            return (v0.y + v1.y + v2.y) / 3;
                        }
                        const w1 = ((v1.z - v2.z) * (px - v2.x) + (v2.x - v1.x) * (pz - v2.z)) / denom;
                        const w2 = ((v2.z - v0.z) * (px - v2.x) + (v0.x - v2.x) * (pz - v2.z)) / denom;
                        const w3 = 1 - w1 - w2;
                        return w1 * v0.y + w2 * v1.y + w3 * v2.y;
                    }
                    
                    function getTriangleNormalY(v0, v1, v2) {
                        const e1x = v1.x - v0.x, e1y = v1.y - v0.y, e1z = v1.z - v0.z;
                        const e2x = v2.x - v0.x, e2y = v2.y - v0.y, e2z = v2.z - v0.z;
                        const nx = e1y * e2z - e1z * e2y;
                        const ny = e1z * e2x - e1x * e2z;
                        const nz = e1x * e2y - e1y * e2x;
                        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        if (len < 0.0001) return 0;
                        return ny / len;
                    }
                    
                    // 1) 场景地面：体素垂直向下射线（从 searchMaxY 开始，二分细化到亚厘米）
                    if (voxelCollision) {
                        const vy = voxelCollision.groundHeightAt(
                            posX, posZ, searchMaxY, groundSearchDrop
                        );
                        if (vy !== null && vy > groundHeight) {
                            groundHeight = vy;
                            stompOwner = null;   // 场景地面不可踩踏消灭
                        }
                    }

                    // 2) 动态道具表面：保留原有三角形逻辑（支持马里奥式踩踏）
                    for (const tri of propCollisionTriangles) {
                        if (ignoreSet && tri.owner && ignoreSet.has(tri.owner)) continue;
                        const { v0, v1, v2 } = tri;

                        const normalY = getTriangleNormalY(v0, v1, v2);
                        if (normalY < 0.3) continue;

                        const minX = Math.min(v0.x, v1.x, v2.x) - characterRadius;
                        const maxX = Math.max(v0.x, v1.x, v2.x) + characterRadius;
                        const minZ = Math.min(v0.z, v1.z, v2.z) - characterRadius;
                        const maxZ = Math.max(v0.z, v1.z, v2.z) + characterRadius;

                        if (posX < minX || posX > maxX || posZ < minZ || posZ > maxZ) continue;

                        if (pointInTriangleXZ(posX, posZ, v0, v1, v2)) {
                            const triY = getTriangleYAt(posX, posZ, v0, v1, v2);
                            if (triY >= searchMinY && triY <= searchMaxY && triY > groundHeight) {
                                groundHeight = triY;
                                stompOwner = tri.stompOwner || null;
                            }
                        }
                    }

                    const y = groundHeight === -Infinity ? groundY : groundHeight;
                    return { y, stompOwner };
                }

                function getGroundHeight(posX, posZ, searchMaxY, ignoreOwners) {
                    return getGroundQuery(posX, posZ, searchMaxY, ignoreOwners).y;
                }

                /**
                 * Find the closest usable floor around the requested spawn point.
                 * Voxel generation can move the exact origin by a few centimeters,
                 * and a fixed (0, 0, 0) fallback is unsafe for scenes whose floor is
                 * offset or split into several rooms.
                 */
                function findNearestVoxelSpawn(
                    preferredX = 0,
                    preferredY = 0,
                    preferredZ = 0,
                    collision = voxelCollision,
                    capsuleRadius = characterRadius,
                    capsuleHeight = characterHeight
                ) {
                    if (!collision) return null;

                    const bounds = collision.getWorldBounds();
                    const heightSpan = Math.max(1, bounds.max[1] - bounds.min[1]);
                    const sampleStep = Math.max(0.1, collision.res * 2);
                    // Search locally around the authored foot height. Starting at
                    // scene maxY can hit the ceiling top before the intended floor.
                    const top = pc.math.clamp(
                        preferredY + GROUND_MAX_STEP_UP + 0.10,
                        bounds.min[1] + collision.res,
                        bounds.max[1] - collision.res
                    );
                    const maxDrop = Math.max(0.8, GROUND_MAX_STEP_DOWN + 0.45);
                    const minX = bounds.min[0] + capsuleRadius;
                    const maxX = bounds.max[0] - capsuleRadius;
                    const minZ = bounds.min[2] + capsuleRadius;
                    const maxZ = bounds.max[2] - capsuleRadius;

                    const test = (x, z) => {
                        if (x < minX || x > maxX || z < minZ || z > maxZ) return null;
                        const ground = collision.groundHeightAt(x, z, top, maxDrop);
                        if (ground === null) return null;
                        const fixed = collision.resolvePenetration(
                            x, ground + 0.02, z, capsuleRadius, capsuleHeight
                        );
                        if (!fixed) return null;
                        const groundAfterFix = collision.groundHeightAt(
                            fixed.x, fixed.z, fixed.y + 0.5, Math.max(2, heightSpan)
                        );
                        if (groundAfterFix === null) return null;
                        const y = collision.groundedFootHeightAt(
                            fixed.x, fixed.z, groundAfterFix,
                            capsuleRadius, capsuleHeight,
                            {
                                maxStepUp: 0,
                                maxStepDown: 0,
                                supportDrop: GROUND_SUPPORT_DROP,
                                supportRadius: 0,
                                skin: GROUND_SKIN
                            }
                        );
                        if (!Number.isFinite(y)) return null;
                        if (collision.isCapsuleBlocked(
                            fixed.x, y, fixed.z, capsuleRadius, capsuleHeight
                        )) return null;
                        return { x: fixed.x, y, z: fixed.z };
                    };

                    let nearest = test(preferredX, preferredZ);
                    let nearestDistance = nearest
                        ? Math.hypot(nearest.x - preferredX, nearest.z - preferredZ)
                        : Infinity;
                    if (nearestDistance < 1e-9) return nearest;

                    // Expand in rings and compare the final position after penetration
                    // recovery. resolvePenetration can move a candidate by at most
                    // 40 voxels, so once the next ring cannot beat the current result
                    // the result is globally nearest among all sampled candidates.
                    const maxSearchRadius = Math.max(
                        Math.hypot(preferredX - minX, preferredZ - minZ),
                        Math.hypot(preferredX - minX, preferredZ - maxZ),
                        Math.hypot(preferredX - maxX, preferredZ - minZ),
                        Math.hypot(preferredX - maxX, preferredZ - maxZ)
                    );
                    const maxRing = Math.ceil(maxSearchRadius / sampleStep) + 1;
                    const maxRecoveryDistance = collision.res * 40;
                    for (let ring = 1; ring <= maxRing; ring++) {
                        const radius = ring * sampleStep;
                        const samples = Math.max(8, Math.ceil((Math.PI * 2 * radius) / sampleStep));
                        for (let i = 0; i < samples; i++) {
                            const a = (i / samples) * Math.PI * 2;
                            const candidate = test(
                                preferredX + Math.cos(a) * radius,
                                preferredZ + Math.sin(a) * radius
                            );
                            if (!candidate) continue;
                            const distance = Math.hypot(
                                candidate.x - preferredX,
                                candidate.z - preferredZ
                            );
                            if (distance < nearestDistance) {
                                nearest = candidate;
                                nearestDistance = distance;
                            }
                        }
                        const nextRingLowerBound = Math.max(
                            0,
                            (ring + 1) * sampleStep - maxRecoveryDistance
                        );
                        if (nearest && nextRingLowerBound >= nearestDistance - 1e-9) {
                            return nearest;
                        }
                    }
                    return nearest;
                }

                // 第一人称玩家仅保留不可见胶囊根节点，碰撞和移动仍复用原系统。
                const characterEntity = new pc.Entity('Character', app);
                // 出生点：从场景原点附近自动寻找最近合法地面。
                let spawnX = 0, spawnY = 0, spawnZ = 0;
                if (voxelCollision) {
                    const preferredSpawn = Array.isArray(SCENE_CONFIG.spawn) ? SCENE_CONFIG.spawn : [0, 0, 0];
                    const found = findNearestVoxelSpawn(
                        preferredSpawn[0], preferredSpawn[1], preferredSpawn[2]
                    );
                    if (found) {
                        spawnX = found.x;
                        spawnY = found.y;
                        spawnZ = found.z;
                    } else {
                        console.warn('⚠️ 出生点附近找不到自由空间，请检查场景出生点与体素碰撞数据');
                    }
                    console.log(`🎯 出生点自动落地: (${spawnX.toFixed(2)}, ${spawnY.toFixed(2)}, ${spawnZ.toFixed(2)})`);
                }

                characterEntity.setLocalPosition(spawnX, spawnY, spawnZ);
                const initialCharacterYaw = Number.isFinite(SCENE_CONFIG.spawnYaw)
                    ? SCENE_CONFIG.spawnYaw
                    : 0;
                characterEntity.setLocalEulerAngles(0, initialCharacterYaw, 0);
                app.root.addChild(characterEntity);
                const lastSafePose = { x: spawnX, y: spawnY, z: spawnZ };

                /**
                 * Recover exceptional blocked states without a horizontal search.
                 * Normal movement never uses this path: first try the same <= skin
                 * vertical correction, then fall back to the last verified stance.
                 */
                function recoverBlockedCharacterPose() {
                    if (!collisionEnabled) return '';
                    const pos = characterEntity.getPosition();
                    if (!checkCollisionXZ(pos.x, pos.y, pos.z)) return '';

                    const recoveredY = recoverCharacterFootWithinSkin(pos.x, pos.y, pos.z);
                    if (Number.isFinite(recoveredY)) {
                        characterEntity.setPosition(pos.x, recoveredY, pos.z);
                        return 'skin';
                    }

                    if (lastSafePose && !checkCollisionXZ(
                        lastSafePose.x, lastSafePose.y, lastSafePose.z
                    )) {
                        characterEntity.setPosition(
                            lastSafePose.x, lastSafePose.y, lastSafePose.z
                        );
                        velocityY = 0;
                        isGrounded = true;
                        isJumping = false;
                        return 'last-safe';
                    }
                    return 'blocked';
                }

                // The narrative controller owns every cat transform to avoid competing update loops.
                const blackCatEntity = new pc.Entity('BlackCatNpc', app);
                const blackCatModel = assets.blackCat.resource?.instantiateRenderEntity({ castShadows: true });
                if (!blackCatModel) throw new Error('黑猫模型加载失败');
                blackCatModel.setLocalScale(0.032256, 0.032256, 0.032256);
                blackCatModel.setLocalPosition(0, 0.093216, 0);
                blackCatEntity.addChild(blackCatModel);
                blackCatEntity.setLocalPosition(-0.75, 0.02, -0.10);
                blackCatEntity.setLocalEulerAngles(0, 0, 0);
                app.root.addChild(blackCatEntity);

                const blackCatAnimation = assets.blackCat.resource.animations?.find((animation) =>
                    animation.name === 'Animation'
                ) || assets.blackCat.resource.animations?.[0];
                if (blackCatAnimation?.resource) {
                    blackCatModel.addComponent('anim', { activate: true, speed: 1.0 });
                    blackCatModel.anim.loadStateGraph({
                        layers: [{
                            name: 'base',
                            states: [
                                { name: 'START' },
                                { name: 'Walk', speed: 1.0, loop: true }
                            ],
                            transitions: [{ from: 'START', to: 'Walk', time: 0, priority: 0 }]
                        }],
                        parameters: {}
                    });
                    blackCatModel.anim.baseLayer.assignAnimation('Walk', blackCatAnimation.resource);
                    blackCatModel.anim.baseLayer.play('Walk');
                }
                let dreamController = null;

                const placedDecorEntities = [];
                const pushablePropEntities = [];
                const PUSHABLE_CRATE_CONFIG = {
                    hx: 0.38,
                    hy: 0.38,
                    hz: 0.38,
                    spawnDistance: 1.45,
                    pushClearance: 0.06
                };

                function getPushablePropAabb(record, cx, cy, cz) {
                    const p = record.entity.getPosition();
                    const x = cx ?? p.x;
                    const y = cy ?? p.y;
                    const z = cz ?? p.z;
                    return {
                        minX: x - record.hx,
                        maxX: x + record.hx,
                        minY: y - record.hy,
                        maxY: y + record.hy,
                        minZ: z - record.hz,
                        maxZ: z + record.hz
                    };
                }

                function aabbOverlaps(a, b, padXZ = 0, padY = 0) {
                    return !(
                        a.maxX <= b.minX - padXZ ||
                        a.minX >= b.maxX + padXZ ||
                        a.maxZ <= b.minZ - padXZ ||
                        a.minZ >= b.maxZ + padXZ ||
                        a.maxY <= b.minY - padY ||
                        a.minY >= b.maxY + padY
                    );
                }

                function syncPushablePropCollision(record) {
                    if (!record?.entity) return;
                    removePropCollisionForOwner(record.entity);
                    const p = record.entity.getPosition();
                    appendAxisAlignedBoxCollisionTris(
                        p.x, p.y, p.z,
                        record.hx, record.hy, record.hz,
                        record.entity,
                        null
                    );
                }

                function findBlockingAabbForPushable(record, testAabb) {
                    if (sceneCameraBounds.valid) {
                        const pad = 0.12;
                        if (
                            testAabb.minX < sceneCameraBounds.minX + pad ||
                            testAabb.maxX > sceneCameraBounds.maxX - pad ||
                            testAabb.minZ < sceneCameraBounds.minZ + pad ||
                            testAabb.maxZ > sceneCameraBounds.maxZ - pad
                        ) {
                            return true;
                        }
                    }
                    for (const other of pushablePropEntities) {
                        if (!other?.entity || other.entity === record.entity) continue;
                        if (aabbOverlaps(testAabb, getPushablePropAabb(other), 0.04, 0.04)) return true;
                    }
                    for (const ent of placedDecorEntities) {
                        if (!ent || ent === record.entity) continue;
                        const wb = mergeWorldAabbPlacedDecor(ent);
                        if (!wb) continue;
                        const m = wb.merged;
                        const aabb = {
                            minX: m.center.x - m.halfExtents.x,
                            maxX: m.center.x + m.halfExtents.x,
                            minY: m.center.y - m.halfExtents.y,
                            maxY: m.center.y + m.halfExtents.y,
                            minZ: m.center.z - m.halfExtents.z,
                            maxZ: m.center.z + m.halfExtents.z
                        };
                        if (aabbOverlaps(testAabb, aabb, 0.02, 0.04)) return true;
                    }
                    // 场景碰撞：在目标 AABB 内采样体素，防止把箱子推进墙里
                    if (voxelCollision) {
                        const step = voxelCollision.res;
                        const y0 = testAabb.minY + 0.05;
                        const y1 = testAabb.maxY - 0.05;
                        for (let x = testAabb.minX; x <= testAabb.maxX + 1e-6; x += step) {
                            for (let z = testAabb.minZ; z <= testAabb.maxZ + 1e-6; z += step) {
                                for (let y = y0; y <= y1 + 1e-6; y += step) {
                                    if (voxelCollision.isSolidAtWorld(x, y, z)) return true;
                                }
                            }
                        }
                    }
                    return false;
                }

                function tryMovePushableProp(record, deltaX, deltaZ) {
                    if (!record?.entity) return false;
                    const cur = record.entity.getPosition();
                    const ignoreSelf = new Set([record.entity]);
                    const tryCandidate = (tx, tz) => {
                        const ty = getGroundHeight(tx, tz, cur.y + record.hy + 1.2, ignoreSelf) + record.hy;
                        const testAabb = getPushablePropAabb(record, tx, ty, tz);
                        if (findBlockingAabbForPushable(record, testAabb)) return null;
                        return { x: tx, y: ty, z: tz };
                    };
                    const cand =
                        tryCandidate(cur.x + deltaX, cur.z + deltaZ) ||
                        tryCandidate(cur.x + deltaX, cur.z) ||
                        tryCandidate(cur.x, cur.z + deltaZ);
                    if (!cand) return false;
                    record.entity.setPosition(cand.x, cand.y, cand.z);
                    syncPushablePropCollision(record);
                    return true;
                }

                function tryPushPropsForCharacterMove(curX, curY, curZ, deltaX, deltaZ) {
                    const movedOwners = new Set();
                    if ((Math.abs(deltaX) + Math.abs(deltaZ)) < 1e-6) return movedOwners;
                    const nextCharAabb = {
                        minX: curX + deltaX - characterRadius,
                        maxX: curX + deltaX + characterRadius,
                        minY: curY,
                        maxY: curY + characterHeight,
                        minZ: curZ + deltaZ - characterRadius,
                        maxZ: curZ + deltaZ + characterRadius
                    };
                    for (const record of pushablePropEntities) {
                        if (!record?.entity) continue;
                        const expanded = getPushablePropAabb(record);
                        expanded.minX -= PUSHABLE_CRATE_CONFIG.pushClearance;
                        expanded.maxX += PUSHABLE_CRATE_CONFIG.pushClearance;
                        expanded.minZ -= PUSHABLE_CRATE_CONFIG.pushClearance;
                        expanded.maxZ += PUSHABLE_CRATE_CONFIG.pushClearance;
                        if (!aabbOverlaps(nextCharAabb, expanded, 0, 0.04)) continue;
                        if (tryMovePushableProp(record, deltaX, deltaZ)) {
                            movedOwners.add(record.entity);
                        }
                    }
                    return movedOwners;
                }

                function placePushableCrateNearCharacter() {
                    const idx = pushablePropEntities.length + 1;
                    const ent = new pc.Entity(`木箱_${idx}`, app);
                    ent.addComponent('render', { type: 'box', castShadows: true });
                    const mat = new pc.StandardMaterial();
                    mat.diffuse = new pc.Color(0.56, 0.34, 0.18);
                    mat.emissive = new pc.Color(0.08, 0.04, 0.02);
                    mat.shininess = 18;
                    mat.update();
                    ent.render.meshInstances[0].material = mat;
                    ent.setLocalScale(
                        PUSHABLE_CRATE_CONFIG.hx * 2,
                        PUSHABLE_CRATE_CONFIG.hy * 2,
                        PUSHABLE_CRATE_CONFIG.hz * 2
                    );
                    const pos = characterEntity.getPosition();
                    const yawRad = characterYaw * Math.PI / 180;
                    const fwdX = Math.sin(yawRad);
                    const fwdZ = Math.cos(yawRad);
                    const x = pos.x + fwdX * PUSHABLE_CRATE_CONFIG.spawnDistance;
                    const z = pos.z + fwdZ * PUSHABLE_CRATE_CONFIG.spawnDistance;
                    const y = getGroundHeight(x, z, pos.y + 2) + PUSHABLE_CRATE_CONFIG.hy;
                    ent.setPosition(x, y, z);
                    app.root.addChild(ent);
                    const record = {
                        entity: ent,
                        hx: PUSHABLE_CRATE_CONFIG.hx,
                        hy: PUSHABLE_CRATE_CONFIG.hy,
                        hz: PUSHABLE_CRATE_CONFIG.hz
                    };
                    pushablePropEntities.push(record);
                    syncPushablePropCollision(record);
                    console.log(`📦 已放置可推动木箱 (${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)})`);
                }

                function placeTreadmillNearCharacter() {
                    const res = assets.treadmillGlb?.resource;
                    if (!res) {
                        console.warn('⚠️ 跑步机 GLB 未加载');
                        return;
                    }
                    const ent = res.instantiateRenderEntity({ castShadows: true });
                    const tmIdx = placedDecorEntities.filter((e) => e.name && String(e.name).startsWith('跑步机')).length + 1;
                    ent.name = `跑步机_${tmIdx}`;
                    const pos = characterEntity.getPosition();
                    const yawRad = characterYaw * Math.PI / 180;
                    const fwdX = Math.sin(yawRad);
                    const fwdZ = Math.cos(yawRad);
                    const d = 1.35;
                    ent.setPosition(pos.x + fwdX * d, pos.y, pos.z + fwdZ * d);
                    ent.setLocalEulerAngles(0, characterYaw, 0);
                    ent.setLocalScale(2.5, 2.5, 2.5);
                    app.root.addChild(ent);
                    placedDecorEntities.push(ent);
                    const p = ent.getPosition();
                    console.log(`🏃 已放置跑步机 (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}) 朝向 ${characterYaw.toFixed(0)}°`);
                    schedulePlacedDecorCollisionBuild(ent, ent.name, ent);
                }

                function destroyStompableDecor(rootEnt) {
                    if (!rootEnt) return;
                    const nm = rootEnt.name;
                    propCollisionTriangles = propCollisionTriangles.filter((t) => t.stompOwner !== rootEnt);
                    const si = placedDecorEntities.indexOf(rootEnt);
                    if (si >= 0) placedDecorEntities.splice(si, 1);
                    rootEnt.destroy();
                    recomputeSceneCameraBounds();
                    console.log('👟 踩踏消灭:', nm);
                }

                /** 与 collectRenderModelComponentsUnder 一致数据源，合并世界 AABB */
                function mergeWorldAabbPlacedDecor(rootEntity) {
                    const merged = new pc.BoundingBox();
                    let ok = false;
                    const comps = collectRenderModelComponentsUnder(rootEntity);
                    for (let ci = 0; ci < comps.length; ci++) {
                        const comp = comps[ci];
                        if (!comp || !comp.meshInstances) continue;
                        for (let mi = 0; mi < comp.meshInstances.length; mi++) {
                            const box = comp.meshInstances[mi].aabb;
                            if (!box) continue;
                            if (!ok) {
                                merged.copy(box);
                                ok = true;
                            } else {
                                merged.add(box);
                            }
                        }
                    }
                    if (!ok) return null;
                    const minY = merged.center.y - merged.halfExtents.y;
                    const maxY = merged.center.y + merged.halfExtents.y;
                    return { minY, maxY, merged };
                }

                function removePropCollisionForOwner(owner) {
                    if (!owner) return;
                    propCollisionTriangles = propCollisionTriangles.filter((t) => t.owner !== owner && t.stompOwner !== owner);
                }

                /** 有 mesh 时仅用网格三角；无 mesh 时用 AABB 盒三角（竖面靠 pointToTriangleDistXZRobust） */
                function syncPlacedDecorMeshCollision(rootForMeshSearch, label, stompOwnerEntity) {
                    if (stompOwnerEntity && stompOwnerEntity.syncHierarchy) {
                        stompOwnerEntity.syncHierarchy();
                    }
                    removePropCollisionForOwner(rootForMeshSearch);
                    if (stompOwnerEntity !== rootForMeshSearch) {
                        removePropCollisionForOwner(stompOwnerEntity);
                    }
                    const meshN = appendWorldMeshTrianglesFromRenderRoot(
                        rootForMeshSearch,
                        label,
                        rootForMeshSearch,
                        stompOwnerEntity
                    );
                    let boxN = 0;
                    if (meshN === 0) {
                        const wb = mergeWorldAabbPlacedDecor(stompOwnerEntity);
                        if (wb) {
                            const m = wb.merged;
                            const hx = Math.max(0.22, m.halfExtents.x);
                            const hy = Math.max(0.28, m.halfExtents.y);
                            const hz = Math.max(0.22, m.halfExtents.z);
                            boxN = appendAxisAlignedBoxCollisionTris(
                                m.center.x,
                                m.center.y,
                                m.center.z,
                                hx,
                                hy,
                                hz,
                                rootForMeshSearch,
                                stompOwnerEntity
                            );
                            console.log(`🧱 ${label} 未抽到 mesh，已用引擎 AABB 包围盒补碰撞 (${boxN} 三角)`);
                        } else {
                            const p = stompOwnerEntity.getPosition();
                            boxN = appendAxisAlignedBoxCollisionTris(
                                p.x,
                                p.y + 0.62,
                                p.z,
                                1.05,
                                0.62,
                                1.05,
                                rootForMeshSearch,
                                stompOwnerEntity
                            );
                            console.warn(`⚠️ ${label} 尚无 mesh/AABB，已用大型占位包围盒补碰撞`);
                        }
                    }
                    const playerPos = characterEntity.getPosition();
                    const withoutOwner = new Set([rootForMeshSearch, stompOwnerEntity]);
                    const wasFreeWithoutOwner = !checkCollisionXZ(
                        playerPos.x, playerPos.y, playerPos.z, withoutOwner
                    );
                    const blockedWithOwner = checkCollisionXZ(
                        playerPos.x, playerPos.y, playerPos.z
                    );
                    if (wasFreeWithoutOwner && blockedWithOwner) {
                        removePropCollisionForOwner(rootForMeshSearch);
                        if (stompOwnerEntity !== rootForMeshSearch) {
                            removePropCollisionForOwner(stompOwnerEntity);
                        }
                        const placedIndex = placedDecorEntities.indexOf(stompOwnerEntity);
                        if (placedIndex >= 0) placedDecorEntities.splice(placedIndex, 1);
                        if (stompOwnerEntity && !stompOwnerEntity._destroying) {
                            stompOwnerEntity.destroy();
                        }
                        recomputeSceneCameraBounds();
                        console.warn(`⚠️ ${label} 的碰撞体会覆盖玩家，已取消本次摆放`);
                        return { meshN: 0, totalTris: 0, rejected: true };
                    }

                    recomputeSceneCameraBounds();
                    return { meshN, totalTris: meshN + boxN, rejected: false };
                }

                /** 与跑步机一致：优先抽到真实 mesh；勿用「已有 AABB」提前结束，否则 mesh 顶点未就绪会永远只有盒体或空 */
                function schedulePlacedDecorCollisionBuild(rootForMeshSearch, label, stompOwnerEntity) {
                    const MAX_FRAMES = 20;
                    let frame = 0;
                    const step = () => {
                        const r = syncPlacedDecorMeshCollision(rootForMeshSearch, frame ? `${label}_r${frame}` : label, stompOwnerEntity);
                        frame++;
                        const done = r.rejected || r.meshN > 0 || frame >= MAX_FRAMES;
                        if (!done) {
                            app.once('postrender', step);
                        } else if (r.rejected) {
                            return;
                        } else if (r.meshN > 0 && frame > 1) {
                            console.log(`🧱 ${label} 第 ${frame} 帧抽到 mesh：${r.meshN} 三角`);
                        } else if (r.meshN === 0 && frame >= MAX_FRAMES) {
                            console.warn(`⚠️ ${label} ${MAX_FRAMES} 帧后仍未抽到 mesh，当前为 AABB/占位盒三角`);
                        }
                    };
                    app.once('postrender', step);
                }

                function validateStompFootOnDecor(posX, posZ, landingY, velocityY, jumpingFlag, rootEnt) {
                    if (!rootEnt || placedDecorEntities.indexOf(rootEnt) < 0) return false;
                    if (!jumpingFlag && velocityY > STOMP_MIN_DOWN_VEL) return false;
                    const wb = mergeWorldAabbPlacedDecor(rootEnt);
                    const pad = characterRadius + 0.22;
                    if (wb) {
                        const m = wb.merged;
                        if (posX < m.center.x - m.halfExtents.x - pad || posX > m.center.x + m.halfExtents.x + pad) return false;
                        if (posZ < m.center.z - m.halfExtents.z - pad || posZ > m.center.z + m.halfExtents.z + pad) return false;
                        if (landingY < wb.minY - 0.4 || landingY > wb.maxY + 0.45) return false;
                        const span = Math.max(0.12, wb.maxY - wb.minY);
                        const topBandLow = wb.maxY - Math.min(1.35, span * 0.72);
                        if (landingY < topBandLow) return false;
                        return true;
                    }
                    const p = rootEnt.getPosition();
                    const h = 1.1;
                    if (posX < p.x - h || posX > p.x + h || posZ < p.z - h || posZ > p.z + h) return false;
                    if (landingY < p.y - 0.25 || landingY > p.y + 2.2) return false;
                    return landingY >= p.y + 0.15;
                }

                /** 优先用地面的 stompOwner；若无或校验失败则扫 placedDecorEntities（三角归属偶发丢失时仍能踩） */
                function resolveStompDecorTarget(posX, posZ, landingY, velocityY, jumpingFlag, queryOwner) {
                    if (validateStompFootOnDecor(posX, posZ, landingY, velocityY, jumpingFlag, queryOwner)) {
                        return queryOwner;
                    }
                    for (let i = placedDecorEntities.length - 1; i >= 0; i--) {
                        const e = placedDecorEntities[i];
                        if (e === queryOwner) continue;
                        if (validateStompFootOnDecor(posX, posZ, landingY, velocityY, jumpingFlag, e)) {
                            return e;
                        }
                    }
                    return null;
                }

                async function placeLoadedContainerDecor(url, title, scaleArr) {
                    const uid = `place_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
                    const a = new pc.Asset(uid, 'container', { url });
                    app.assets.add(a);
                    await new Promise((res, rej) => {
                        const loader = new pc.AssetListLoader([a], app.assets);
                        loader.load((err) => (err ? rej(new Error(String(err))) : res()));
                    });
                    if (!a.resource) {
                        console.warn('⚠️ 摆放模型 resource 为空:', url);
                        return;
                    }
                    // 与玩家角色一致：外层只负责位置/朝向/缩放，勿覆盖 GLB 根节点自带旋转（否则会趴地）
                    const idx = placedDecorEntities.length + 1;
                    const wrapper = new pc.Entity(`摆放_${title}_${idx}`, app);
                    const renderRoot = a.resource.instantiateRenderEntity({ castShadows: true });
                    wrapper.addChild(renderRoot);
                    const pos = characterEntity.getPosition();
                    const yawRad = characterYaw * Math.PI / 180;
                    const fwdX = Math.sin(yawRad);
                    const fwdZ = Math.cos(yawRad);
                    const d = 1.35;
                    wrapper.setPosition(pos.x + fwdX * d, pos.y, pos.z + fwdZ * d);
                    wrapper.setLocalEulerAngles(0, characterYaw, 0);
                    const sx = scaleArr[0] ?? 1;
                    const sy = scaleArr[1] ?? 1;
                    const sz = scaleArr[2] ?? 1;
                    wrapper.setLocalScale(sx, sy, sz);
                    app.root.addChild(wrapper);
                    placedDecorEntities.push(wrapper);
                    const p = wrapper.getPosition();
                    console.log(`📦 已摆放「${title}」 (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)})`);
                    // 与跑步机相同：从 GLB instantiate 根节点抽 mesh；stomp/销毁仍用外层 wrapper
                    schedulePlacedDecorCollisionBuild(renderRoot, wrapper.name, wrapper);
                }

                async function placeCatalogEntry(entry) {
                    try {
                        if (entry.kind === 'treadmill') {
                            placeTreadmillNearCharacter();
                        } else if (entry.kind === 'pushCrate') {
                            placePushableCrateNearCharacter();
                        } else if (entry.kind === 'container') {
                            await placeLoadedContainerDecor(entry.url, entry.title, entry.scale || [1, 1, 1]);
                        }
                        closePlacementPanel();
                    } catch (err) {
                        console.error('摆放失败:', err);
                    }
                }

                const placementOverlay = document.getElementById('placement-overlay');
                const placementGrid = document.getElementById('placement-grid');
                const placementCloseBtn = document.getElementById('placement-close');
                let placementPanelOpen = false;

                function closePlacementPanel() {
                    placementOverlay.style.display = 'none';
                    placementOverlay.setAttribute('aria-hidden', 'true');
                    placementPanelOpen = false;
                }

                function openPlacementPanel() {
                    if (portalSwitching) return;
                    Object.keys(keys).forEach((code) => { keys[code] = false; });
                    placementOverlay.style.display = 'flex';
                    placementOverlay.setAttribute('aria-hidden', 'false');
                    placementPanelOpen = true;
                    if (typeof loadAiProps === 'function') loadAiProps();
                }

                function togglePlacementPanel() {
                    if (placementPanelOpen) closePlacementPanel();
                    else openPlacementPanel();
                }

                function setupPlacementPanel() {
                    const catalog = buildPlacementCatalogFromPresets();
                    placementGrid.innerHTML = '';
                    catalog.forEach((entry) => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'placement-card';
                        btn.innerHTML = `<span class="placement-card-icon">${entry.icon}</span><span class="placement-card-title">${entry.title}</span>`;
                        btn.addEventListener('click', () => { void placeCatalogEntry(entry); });
                        placementGrid.appendChild(btn);
                    });
                    placementCloseBtn.addEventListener('click', closePlacementPanel);
                    placementOverlay.addEventListener('click', (e) => {

                    });
                    document.getElementById('placement-panel').addEventListener('click', (ev) => ev.stopPropagation());
                }
                setupPlacementPanel();

                // ========== 本地缓存道具 ==========
                const PROP_API_BASE = window.location.origin;
                const aiPropGrid = document.getElementById('ai-prop-generated');

                function aiPropCard(item) {
                    const card = document.createElement('div');
                    card.className = 'ai-prop-card';
                    const hasPreview = !!item.preview;
                    card.innerHTML = `${hasPreview
                        ? `<img src="${item.preview}" alt="${item.name}">`
