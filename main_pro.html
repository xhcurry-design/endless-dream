    <script>
        // ========== 录制功能 ==========
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordStartTime = 0;
        let recordTimerInterval = null;
        let recordCaptureStream = null;

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const min = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const sec = (totalSec % 60).toString().padStart(2, '0');
            return min + ':' + sec;
        }

        function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                // 停止录制
                mediaRecorder.stop();
            } else {
                // 仅录制 WebGL Canvas：导出视频不含录制按钮、操作提示等 DOM 叠层
                recordedChunks = [];
                const canvas = document.getElementById('application-canvas');
                if (!canvas) {
                    console.error('未找到 application-canvas');
                    return;
                }
                if (recordCaptureStream) {
                    recordCaptureStream.getTracks().forEach((t) => t.stop());
                    recordCaptureStream = null;
                }
                recordCaptureStream = canvas.captureStream(60);
                const stream = recordCaptureStream;

                // 选择支持的编码格式
                const mimeTypes = [
                    'video/webm;codecs=vp9',
                    'video/webm;codecs=vp8',
                    'video/webm',
                    'video/mp4'
                ];
                let selectedMime = '';
                for (const mime of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mime)) {
                        selectedMime = mime;
                        break;
                    }
                }

                const options = { videoBitsPerSecond: 8000000 };
                if (selectedMime) options.mimeType = selectedMime;

                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    clearInterval(recordTimerInterval);
                    if (recordCaptureStream) {
                        recordCaptureStream.getTracks().forEach((t) => t.stop());
                        recordCaptureStream = null;
                    }
                    btn.classList.remove('recording');
                    btn.innerHTML = '⏺ 开始录制';

                    const ext = (mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4')) ? 'mp4' : 'webm';
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const now = new Date();
                    const ts = now.getFullYear() +
                        String(now.getMonth()+1).padStart(2,'0') +
                        String(now.getDate()).padStart(2,'0') + '_' +
                        String(now.getHours()).padStart(2,'0') +
                        String(now.getMinutes()).padStart(2,'0') +
                        String(now.getSeconds()).padStart(2,'0');
                    a.download = 'recording_' + ts + '.' + ext;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    console.log('🎬 录制完成，已导出: ' + a.download);
                };

                mediaRecorder.start(100); // 每100ms收集一次数据
                recordStartTime = Date.now();
                btn.classList.add('recording');
                btn.innerHTML = '⏹ 停止录制 <span id="record-timer">00:00</span>';

                recordTimerInterval = setInterval(() => {
                    const elapsed = Date.now() - recordStartTime;
                    const timerEl = document.getElementById('record-timer');
                    if (timerEl) timerEl.textContent = formatTime(elapsed);
                }, 500);

                console.log('🎬 开始录制...');
            }
        }
    </script>

    <script type="module">
        const RUN_STATE_KEY = window.EndlessDream.STATE_KEY;
        const launchParams = new URLSearchParams(window.location.search);
        const requestedResumeSource = launchParams.get('resume');
        const resumeSource = requestedResumeSource === 'greenhouse' || requestedResumeSource === 'upside'
            ? requestedResumeSource
            : null;
        const returnedWithMirrorFlower = resumeSource === 'greenhouse' &&
            launchParams.get('reward') === 'mirror-flower';
        const returnedWithSunKey = resumeSource === 'upside' && launchParams.get('reward') === 'sun-key';

        const DEFAULT_SPLAT_EULER = Object.freeze([180, 0, 0]);

        function getSceneSplatEuler(scene) {

        const SCENE_CONFIG = { ...ROOM_GAME_CONFIG, ...GAME_CONFIG };
        (async () => {

                updateLoading('创建场景...');

                // Neutral keeps bright yellows saturated instead of bleaching them toward white.

                // ========== 创建高斯场景实体 ==========
                let splatEntity = new pc.Entity('GaussianScene', app);

                // Non-unified rendering owns a per-component material, so scene-level

                const splatMaterial = splatEntity.gsplat.unified
                    ? null

                if (splatMaterial) {
                    splatMaterial.setDefine('GSPLAT_AA', true);
                    // Preserve thin opaque coverage on the yellow door and other hard edges.
                    // More aggressive values expose the pale skybox through the splat surface.
                    splatMaterial.setParameter('minPixelSize', 2);

                // Main-room-only visual tint for the open exit door. The source

                let exitDoorVisualOverlay = null;
                if (SCENE_CONFIG.id === 'room' && SCENE_CONFIG.exitDoor) {
                    // Measured hinge/free-edge coordinates for the visible door leaf.
                    const hinge = [-2.24, -1.55];
                    const free = [-1.56, -1.50];
                    const dx = free[0] - hinge[0];
                    const dz = free[1] - hinge[1];
                    const doorWidth = Math.hypot(dx, dz);
                    const tangent = [dx / doorWidth, dz / doorWidth];
                    const doorNormal = [-tangent[1], tangent[0]];
                    const doorYaw = Math.atan2(-tangent[1], tangent[0]) * 180 / Math.PI;
                    const normalOffset = 0.018;

                    const doorMaterial = new pc.StandardMaterial();
                    // Keep the source splat detail visible through the warm base.
                    doorMaterial.diffuse = new pc.Color(0.98, 0.70, 0.12);

                    exitDoorVisualOverlay = new pc.Entity('ExitDoorVisualOverlay', app);
                    exitDoorVisualOverlay.addComponent('render', {

                    exitDoorVisualOverlay.setPosition(

                    exitDoorVisualOverlay.setEulerAngles(0, doorYaw, 0);
                    exitDoorVisualOverlay.setLocalScale(doorWidth, 1.55, 0.012);

                }

                // ========== 碰撞网格可视化（仅用于按 1 键查看）==========
                updateLoading('加载碰撞网格...');

                let collisionMeshEntity = null;
                let collisionMeshVisible = false;

                function createCollisionMeshEntity(containerAsset, sceneConfig) {
                    if (!containerAsset?.resource) return null;
                    const entity = containerAsset.resource.instantiateRenderEntity();
                    entity.name = 'CollisionMesh';
                    entity.enabled = collisionMeshVisible;

                    const material = new pc.StandardMaterial();
                    material.diffuse = new pc.Color(0.15, 0.95, 0.45);
                    material.emissive = new pc.Color(0.10, 0.55, 0.28);
                    material.opacity = 0.26;
                    material.blendType = pc.BLEND_NORMAL;
                    material.depthWrite = false;
                    material.cull = pc.CULLFACE_NONE;
                    material.update();

                    entity.findComponents('render').forEach(render => {
                        render.meshInstances.forEach(mi => {
                            mi.material = material;

                    if (sceneConfig.collisionFrame !== 'world') {
                        entity.setLocalEulerAngles(180, 0, 0);

                    app.root.addChild(entity);
