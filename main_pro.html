                async function loadAiProps() {
                    try {
                        const r = await fetch(PROP_API_BASE + '/api/prop/list');
                        if (!r.ok) return;
                        const d = await r.json();
                        aiPropGrid.innerHTML = '';
                        (d.props || []).forEach(p => aiPropGrid.appendChild(aiPropCard(p)));
                    } catch (_) {}
                }

                loadAiProps();

                // Mirror and sunflower passages use the same interaction and fade.
                const portalPrompt = document.getElementById('interaction-prompt');
                const portalPromptText = portalPrompt?.querySelector('span');
                const transitionOverlay = document.getElementById('transition-overlay');
                let portalSwitching = false;
                let portalNearby = false;
                let nearbyPortalKind = null;
                let portalPromptLocked = null;
                let portalPromptController = null;

                function isGameplayInputLocked() {
                    return placementPanelOpen || portalSwitching ||
                        Boolean(window.EndlessDreamGameShell?.isPaused?.()) ||
                        Boolean(dreamController?.isInputLocked());
                }

                function setPortalPrompt(kind) {
                    const nextKind = kind || null;
                    const nextNearby = Boolean(nextKind);
                    const nextLocked = isGameplayInputLocked();
                    const kindChanged = nearbyPortalKind !== nextKind;
                    const controllerChanged = portalPromptController !== dreamController;
                    if (!kindChanged && !controllerChanged &&
                        portalNearby === nextNearby && portalPromptLocked === nextLocked) {
                        return;
                    }
                    nearbyPortalKind = nextKind;
                    portalNearby = nextNearby;
                    portalPromptLocked = nextLocked;
                    portalPromptController = dreamController;
                    if ((kindChanged || controllerChanged) && portalPromptText) {
                        const label = dreamController?.getPortalLabel(nextKind) ||
                            (nextKind === 'sunflower' ? '触碰向日葵' : '触碰镜面');
                        if (portalPromptText.textContent !== label) {
                            portalPromptText.textContent = label;
                        }
                    }
                    portalPrompt?.classList.toggle(
                        'is-visible',
                        nextNearby && !nextLocked
                    );
                }

                function enterNearbyPortal() {
                    if (portalSwitching || placementPanelOpen || dreamController?.isInputLocked()) return;
                    const playerPosition = characterEntity.getPosition();
                    updatePortalInteraction(
                        playerPosition.x, playerPosition.y, playerPosition.z
                    );
                    if (!portalNearby) return;
                    const isSunflowerPortal = nearbyPortalKind === 'sunflower';
                    if (isSunflowerPortal && dreamController && !dreamController.canEnterSunflower()) {
                        dreamController.denySunflower();
                        return;
                    }
                    if (isSunflowerPortal) {
                        dreamController?.offerFlower();
                    }
                    const destination = isSunflowerPortal
                        ? 'run/upside-room/index.html'
                        : 'run/greenhouse/index.html';
                    portalSwitching = true;
                    clearGameplayKeys();
                    setPortalPrompt(null);
                    document.exitPointerLock?.();
                    transitionOverlay?.classList.add('is-active');
                    window.setTimeout(() => {
                        const destinationUrl = new URL(destination, document.baseURI).href;
                        if (isSunflowerPortal) {
                            window.location.replace(destinationUrl);
                        } else {
                            window.location.href = destinationUrl;
                        }
                    }, 720);
                }

                function portalDistanceSquared(x, z, portal) {
                    const position = portal?.approachPosition;
                    if (!Array.isArray(position) || position.length < 3) return Infinity;
                    const offsetX = x - position[0];
                    const offsetZ = z - position[2];
                    return offsetX * offsetX + offsetZ * offsetZ;
                }

                function isInsidePortalApproach(x, y, z, portal, useExitRadius = false) {
                    const position = portal?.approachPosition;
                    const enterRadius = portal?.enterRadius;
                    if (!Array.isArray(position) || position.length < 3 ||
                        !position.slice(0, 3).every(Number.isFinite) ||
                        !Number.isFinite(enterRadius) || enterRadius <= 0) {
                        return false;
                    }
                    const radius = useExitRadius && Number.isFinite(portal.exitRadius)
                        ? Math.max(enterRadius, portal.exitRadius)
                        : enterRadius;
                    if (Number.isFinite(portal.maxVerticalDistance) &&
                        Math.abs(y - position[1]) > portal.maxVerticalDistance) {
                        return false;
                    }
                    return portalDistanceSquared(x, z, portal) <= radius * radius;
                }

                function isPortalAvailable(kind) {
                    if (portalSwitching) return false;
                    if (kind === 'mirror') {
                        return Boolean(SCENE_CONFIG.mirror) &&
                            (!dreamController || dreamController.isMirrorAvailable());
                    }
                    if (kind === 'sunflower') {
                        return !sunKeyOwned && Boolean(SCENE_CONFIG.sunflower) &&
                            (!dreamController || dreamController.isSunflowerAvailable());
                    }
                    return false;
                }

                function updatePortalInteraction(x, y, z) {
                    const mirror = SCENE_CONFIG.mirror;
                    const sunflower = SCENE_CONFIG.sunflower;
                    let kind = null;

                    // Keep the active prompt through a slightly larger exit radius so
                    // collision correction at the boundary cannot make it flicker.
                    const activePortal = nearbyPortalKind === 'mirror' ? mirror
                        : nearbyPortalKind === 'sunflower' ? sunflower
                        : null;
                    if (activePortal && isPortalAvailable(nearbyPortalKind) &&
                        isInsidePortalApproach(x, y, z, activePortal, true)) {
                        kind = nearbyPortalKind;
                    }

                    if (!kind) {
                        const candidates = [];
                        if (isPortalAvailable('mirror') &&
                            isInsidePortalApproach(x, y, z, mirror)) {
                            candidates.push({
                                kind: 'mirror',
                                distanceSquared: portalDistanceSquared(x, z, mirror)
                            });
                        }
                        if (isPortalAvailable('sunflower') &&
                            isInsidePortalApproach(x, y, z, sunflower)) {
                            candidates.push({
                                kind: 'sunflower',
                                distanceSquared: portalDistanceSquared(x, z, sunflower)
                            });
                        }
                        candidates.sort((a, b) => a.distanceSquared - b.distanceSquared);
                        kind = candidates[0]?.kind || null;
                    }
                    setPortalPrompt(kind);
                }
                const camera = new pc.Entity('Camera', app);
                camera.addComponent('camera', {
                    clearColor: new pc.Color(0.78, 0.80, 0.82),
                    fov: getSceneCameraFov(),
                    nearClip: Number.isFinite(SCENE_CONFIG.cameraNearClip)
                        ? SCENE_CONFIG.cameraNearClip : 0.08,
                    farClip: Number.isFinite(SCENE_CONFIG.cameraFarClip)
                        ? SCENE_CONFIG.cameraFarClip : 30,
                    toneMapping: pc.TONEMAP_NEUTRAL
                });
                app.root.addChild(camera);

                // ========== 创建灯光 ==========

                light.addComponent('light', {
                    type: 'directional',

                    color: new pc.Color(1, 1, 1),
                    castShadows: false,
                    shadowBias: 0.2,
                    shadowDistance: 12,

                });
                light.setLocalEulerAngles(45, 30, 0);
                app.root.addChild(light);
                const fillLight = new pc.Entity('FillLight', app);
                fillLight.addComponent('light', {
                    type: 'directional',
                    intensity: 0.35,
                    color: new pc.Color(0.75, 0.82, 1),
                    castShadows: false
                });
                fillLight.setLocalEulerAngles(20, -120, 0);
                app.root.addChild(fillLight);
                app.scene.ambientLight = new pc.Color(0.48, 0.50, 0.55);

                // ========== 创建坐标轴可视化 ==========
                const axisLength = 2;  // 坐标轴长度
                const axisThickness = 0.02;  // 坐标轴粗细
                
                function createAxisLine(color, scaleX, scaleY, scaleZ, posX, posY, posZ) {
                    const axis = new pc.Entity('', app);
                    axis.addComponent('render', { type: 'box' });
                    const mat = new pc.StandardMaterial();
                    mat.diffuse = color;
                    mat.emissive = color;
                    mat.useLighting = false;
                    mat.update();
                    axis.render.meshInstances[0].material = mat;
                    axis.setLocalScale(scaleX, scaleY, scaleZ);
                    axis.setLocalPosition(posX, posY, posZ);
                    return axis;
                }
                
                // 坐标轴容器
                const axisHelper = new pc.Entity('AxisHelper', app);
                
                // X轴 - 红色
                const xAxis = createAxisLine(
                    new pc.Color(1, 0, 0),

                );

                axisHelper.addChild(xAxis);

                );

                // ========== 创建角色碰撞体可视化 ==========
                function createCharacterColliderVisual() {
                    // 主碰撞体（红色半透明盒子）

                    characterFootEntity.enabled = false;
                    app.root.addChild(characterFootEntity);
                    
                    console.log('✅ 角色碰撞体可视化已创建（按 4 键切换显示）');
                }
                
                createCharacterColliderVisual();

                // ========== 控制逻辑 ==========
                const keys = {};
                const gameplayKeyCodes = new Set([
                    'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
                    'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyE', 'Space',
                    'ShiftLeft', 'ShiftRight', 'AltLeft', 'AltRight'
                ]);
                const heldGameplayKeys = new Set();
                let jumpRequested = false;

                function restoreHeldGameplayKeys() {
                    for (const code of gameplayKeyCodes) {
                        keys[code] = heldGameplayKeys.has(code);
                    }
                }

                function clearGameplayKeys() {
                    heldGameplayKeys.clear();
                    Object.keys(keys).forEach((code) => { keys[code] = false; });
                    jumpRequested = false;
                }

                window.addEventListener('keydown', (e) => {
                    const wasHeld = heldGameplayKeys.has(e.code);
                    if (gameplayKeyCodes.has(e.code)) heldGameplayKeys.add(e.code);
                    if (isGameplayInputLocked()) {
                        keys[e.code] = false;
                        if (gameplayKeyCodes.has(e.code)) e.preventDefault();
                        return;
                    }
                    keys[e.code] = true;
                    if (e.code === 'Space' && !wasHeld && !e.repeat) jumpRequested = true;
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                        e.preventDefault();
                    }
                });
                window.addEventListener('keyup', (e) => {
                    heldGameplayKeys.delete(e.code);
                    keys[e.code] = false;
                });

                const moveSpeed = 2.25;
                const runSpeedMul = 1.55;
                let cameraYaw = initialCharacterYaw;
                let cameraPitch = Number.isFinite(SCENE_CONFIG.spawnPitch)
                    ? SCENE_CONFIG.spawnPitch : 0;
                const firstPersonHud = document.getElementById('first-person-hud');
                const pointerLockPrompt = document.getElementById('pointer-lock-prompt');

                function syncPointerLockPrompt() {
                    const unlocked = document.pointerLockElement !== canvas && !isGameplayInputLocked();
                    pointerLockPrompt?.classList.toggle('is-visible', unlocked);
                }
                
                canvas.addEventListener('mousedown', () => {
                    if (isGameplayInputLocked()) return;
                    canvas.requestPointerLock?.();
                });

                window.addEventListener('blur', () => {
                    clearGameplayKeys();
                });

                window.addEventListener('mousemove', (e) => {
                    if (document.pointerLockElement !== canvas || isGameplayInputLocked()) return;
                    if (dreamController) {
                        const nextLook = dreamController.applyLookDelta(cameraYaw, cameraPitch, e.movementX, e.movementY);
                        cameraYaw = nextLook.yaw;
                        cameraPitch = nextLook.pitch;
                        return;
                    }
                    cameraYaw -= e.movementX * 0.08;
                    cameraPitch -= e.movementY * 0.08;
                    cameraPitch = pc.math.clamp(cameraPitch, -75, 75);
                });

                function handlePointerLockChange() {
                    if (document.pointerLockElement !== canvas) clearGameplayKeys();
                    syncPointerLockPrompt();
                }

                document.addEventListener('pointerlockchange', handlePointerLockChange);
                app.on('destroy', () => document.removeEventListener('pointerlockchange', handlePointerLockChange));

                // 阻止滚轮引发浏览器级页面移动。
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                }, { passive: false });
                
                let characterYaw = initialCharacterYaw;
                
                // 快捷键
                window.addEventListener('keydown', (e) => {
                    if (window.EndlessDreamGameShell?.isPaused?.()) {
                        clearGameplayKeys();
                        return;
                    }
                    if (dreamController?.handleKeyDown(e)) {
                        e.preventDefault();
                        clearGameplayKeys();
                        return;
                    }
                    if (portalSwitching) {
                        e.preventDefault();
                        return;
                    }
                    if (placementPanelOpen) {
                        if (e.code === 'Escape' || e.code === 'AltLeft' || e.code === 'AltRight') {
                            e.preventDefault();
                            closePlacementPanel();
                        }
                        return;
                    }
                    if (!devMode) {
                        if (e.code === 'KeyE' && !e.repeat && portalNearby) {
                            enterNearbyPortal();
                        }
                        return;
                    }
                    if (e.code === 'Digit1') {
                        if (collisionMeshEntity) {
                            collisionMeshVisible = !collisionMeshVisible;
                            collisionMeshEntity.enabled = collisionMeshVisible;
                            console.log('🟢 碰撞网格可视化: ' + (collisionMeshVisible ? '显示' : '隐藏'));
                        } else {
                            console.warn('⚠️ 碰撞网格未加载');
                        }
                    }
                    // 数字键 2 - 切换高斯场景可视化
                    if (e.code === 'Digit2') {
                        splatVisible = !splatVisible;
                        splatEntity.enabled = splatVisible;
                        console.log('🔵 高斯场景可视化: ' + (splatVisible ? '显示' : '隐藏'));
                    }
                    // 数字键 3 - 切换坐标轴可视化
                    if (e.code === 'Digit3') {
                        axisHelper.enabled = !axisHelper.enabled;
                        console.log('📐 坐标轴: ' + (axisHelper.enabled ? '显示' : '隐藏') + ' (X红 Y绿 Z蓝)');
                    }
                    // 数字键 4 - 切换角色碰撞体可视化
                    if (e.code === 'Digit4') {
                        characterColliderVisible = !characterColliderVisible;
                        if (characterColliderEntity) characterColliderEntity.enabled = characterColliderVisible;
                        if (characterFootEntity) characterFootEntity.enabled = characterColliderVisible;
                        console.log('🔴 角色碰撞体: ' + (characterColliderVisible ? '显示' : '隐藏'));
                    }
                    if (e.code === 'KeyC') {
                        collisionEnabled = !collisionEnabled;
                        if (collisionEnabled) recoverBlockedCharacterPose();
                        console.log('碰撞检测: ' + (collisionEnabled ? '开启' : '关闭'));
                    }
                    if (e.code === 'KeyP') {
                        const pos = characterEntity.getPosition();
                        console.log(`角色位置: (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})`);
                        debugPanel.style.display = debugPanel.style.display === 'none' ? 'block' : 'none';
                    }
                    if (e.code === 'KeyL') {
                        positionLocked = !positionLocked;
                        if (positionLocked) {
                            velocityY = 0;
                            isGrounded = true;
                            isJumping = false;
                        }
                        console.log('🔒 位置锁定: ' + (positionLocked ? '开启（悬浮）' : '关闭'));
                    }
                    if (e.code === 'KeyR') {
                        toggleRecording();
                    }
                    if ((e.code === 'AltLeft' || e.code === 'AltRight') && !e.repeat) {
                        const t = e.target;
                        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
                        e.preventDefault();
                        togglePlacementPanel();
                    }
                    if (e.code === 'KeyE' && !e.repeat && portalNearby) {
                        enterNearbyPortal();
                    }
                    if (e.code === 'Escape') {
                        e.preventDefault();
                    }
                });
                
                let lastGroundY = spawnY;
                let cameraSmoothY = null;
                let cameraStableGroundY = null;
                let cameraGroundCandidateY = null;
                let cameraGroundCandidateTime = 0;
                const cameraEyeHeight = Number.isFinite(SCENE_CONFIG.eyeHeight)
                    ? SCENE_CONFIG.eyeHeight : characterHeight * 0.86;
                const cameraGroundNoiseBand = Math.max(
                    0.012,
                    (voxelCollision?.res || 0.02) * 1.1
                );

                function getStableCameraGroundY(footY, dt) {
                    if (!Number.isFinite(cameraStableGroundY)) {
                        cameraStableGroundY = footY;
                        cameraGroundCandidateY = null;
                        return footY;
                    }

                    const delta = footY - cameraStableGroundY;
                    if (Math.abs(delta) <= cameraGroundNoiseBand) {
                        cameraGroundCandidateY = null;
                        cameraGroundCandidateTime = 0;
                        return cameraStableGroundY;
                    }

                    if (!Number.isFinite(cameraGroundCandidateY) ||
                        Math.abs(footY - cameraGroundCandidateY) > cameraGroundNoiseBand * 2.5) {
                        cameraGroundCandidateY = footY;
                        cameraGroundCandidateTime = 0;
                    } else {
                        cameraGroundCandidateY = footY;
                        cameraGroundCandidateTime += dt;
                    }

                    if (Math.abs(delta) >= GROUND_MAX_STEP_UP * 0.75 ||
                        cameraGroundCandidateTime >= 0.06) {
                        cameraStableGroundY = cameraGroundCandidateY;
                        cameraGroundCandidateY = null;
                        cameraGroundCandidateTime = 0;
                    }
                    return cameraStableGroundY;
                }

                let debugUpdateAccumulator = 0;
                 
                app.on('update', (dt) => {
                    if (window.EndlessDreamGameShell?.isPaused?.()) {
                        clearGameplayKeys();
                        return;
                    }

                    dt = Math.min(0.05, Math.max(0, Number(dt) || 0));

                    const gameplayInputLocked = isGameplayInputLocked();

                    const charPos = characterEntity.getPosition();
                    const frameStartX = charPos.x;
                    const frameStartZ = charPos.z;
                    let finalX = charPos.x;
                    let finalY = charPos.y;
                    let finalZ = charPos.z;

                    // ========== 跳跃处理 ==========
                    const jumpPressed = jumpRequested;
                    jumpRequested = false;
                    if (!gameplayInputLocked && jumpPressed && isGrounded && !isJumping) {
                        velocityY = jumpForce;
                        isJumping = true;
                        isGrounded = false;
                        
                    }

                    // ========== 重力 + 地面检测 ==========
                    if (positionLocked) {
                        // 位置锁定：不施加重力，角色悬浮在当前位置
                        velocityY = 0;
                    } else if (isGrounded && !isJumping) {
                        // ---- 着地状态 ----
                        const currentGroundY = getContinuousGroundY(finalX, finalY, finalZ);
                        lastGroundY = currentGroundY;
                        velocityY = 0;
                        if (Number.isFinite(currentGroundY) &&
                            canSnapToGround(finalX, currentGroundY, finalZ)) {
                            finalY = currentGroundY;
                        } else {
                            // 地面上方净空不足时不能把完整胶囊强行塞进去。
                            isGrounded = false;
                        }
                    } else {
                        // ---- 空中状态（跳跃中或下落中）----
                        const oldY = finalY;
                        velocityY += gravity * dt;
                        const impactVelocityY = velocityY;
                        const candidateY = oldY + impactVelocityY * dt;
                        const verticalMove = sweepCharacterY(finalX, oldY, finalZ, candidateY);
                        finalY = verticalMove.y;

                        // 撞顶或向下碰到实体时立即消除朝碰撞面的速度；落地逻辑仍使用
                        // 碰撞前速度，以保留动态道具的踩踏判定与反弹力度。
                        if (verticalMove.hit) velocityY = 0;

                        if (impactVelocityY <= 0) {
                            const landingEpsilon = Math.max(
                                0.025,
                                voxelCollision ? voxelCollision.res * 0.75 : 0.04
                            );
                            // 从本帧旧脚底附近向下找地面，不能再从“新头顶”向下找，
                            // 否则穿过顶板后会错误吸附到顶板上表面。
                            const gAir = getGroundQuery(finalX, finalZ, oldY + landingEpsilon);
                            const sampledGroundY = gAir.y;
                            const currentGroundY = collisionEnabled &&
                                sampledGroundY > groundY + GROUND_SKIN
                                ? recoverCharacterFootWithinSkin(
                                    finalX, sampledGroundY, finalZ
                                )
                                : sampledGroundY;
                            lastGroundY = currentGroundY;

                            const crossedGround = crossedGroundThisFrame(
                                oldY, verticalMove.y, currentGroundY, landingEpsilon
                            );
                            if (Number.isFinite(currentGroundY) && crossedGround &&
                                canSnapToGround(finalX, currentGroundY, finalZ)) {
                                const stompEnt = resolveStompDecorTarget(
                                    finalX, finalZ, currentGroundY, impactVelocityY, isJumping, gAir.stompOwner
                                );
                                if (stompEnt) {
                                    destroyStompableDecor(stompEnt);
                                    const bounceY = currentGroundY + 0.06;
                                    finalY = canSnapToGround(finalX, bounceY, finalZ)
                                        ? bounceY
                                        : currentGroundY;
                                    velocityY = STOMP_BOUNCE_VEL;
                                    isGrounded = false;
                                    isJumping = true;
                                } else {
                                    finalY = currentGroundY;
                                    velocityY = 0;
                                    isGrounded = true;
                                    if (isJumping) {
                                        isJumping = false;
                                    }
                                }
                            }
                        }
                    }
                    
                    // 防止掉出世界
                    if (finalY < groundY) {
                        finalY = groundY;
                        velocityY = 0;
                        isGrounded = true;
                    }

                    // ========== 水平移动 ==========
                    let moveX = 0;
                    let moveZ = 0;
                    let groundedSweepY = null;

                    if (!gameplayInputLocked) {
                    if (keys['ArrowUp'] || keys['KeyW']) moveZ = 1;
                    if (keys['ArrowDown'] || keys['KeyS']) moveZ = -1;
                    if (keys['ArrowLeft'] || keys['KeyA']) moveX = -1;
                    if (keys['ArrowRight'] || keys['KeyD']) moveX = 1;
                    }

                    if (moveX !== 0 || moveZ !== 0) {
                        const yawRad = cameraYaw * Math.PI / 180;
                        
                        const forwardX = -Math.sin(yawRad);
                        const forwardZ = -Math.cos(yawRad);
                        const rightX = Math.cos(yawRad);
                        const rightZ = -Math.sin(yawRad);

                        let worldMoveX = forwardX * moveZ + rightX * moveX;
                        let worldMoveZ = forwardZ * moveZ + rightZ * moveX;

                        const len = Math.sqrt(worldMoveX * worldMoveX + worldMoveZ * worldMoveZ);
                        if (len > 0) {
                            worldMoveX /= len;
                            worldMoveZ /= len;
                        }

                        const shiftHeld = keys['ShiftLeft'] || keys['ShiftRight'];
                        const useRunMove = shiftHeld;
                        const moveDist = moveSpeed * (useRunMove ? runSpeedMul : 1) * dt;
                        
                        let newX = finalX + worldMoveX * moveDist;
                        let newZ = finalZ + worldMoveZ * moveDist;
                        const pushedOwners = tryPushPropsForCharacterMove(finalX, finalY, finalZ, worldMoveX * moveDist, worldMoveZ * moveDist);
                        
                        // 正常着地时使用贴地 CCD：水平每个子步都跟随最近合法地面，
                        // 这样坡面/5cm 高度变化不会再被旧脚底高度误判成墙。
                        // 跳跃中仍使用固定 Y 的 CCD，保持空中碰撞语义不变。
                        if (collisionEnabled) {
                            if (isGrounded && !isJumping) {
                                const intendedX = newX;
                                const intendedZ = newZ;
                                const swept = sweepCharacterGrounded(
                                    finalX, finalY, finalZ, intendedX, intendedZ, pushedOwners
                                );
                                newX = swept.x;
                                newZ = swept.z;
                                if (Number.isFinite(swept.y) && swept.grounded) {
                                    groundedSweepY = swept.y;
                                } else {
                                    // 起点异常或地面断开时，退回固定高度 CCD，
                                    // 让重力系统在下一帧接管，而不是把角色塞进边缘。
                                    const fallback = sweepCharacterXZ(
                                        finalX, finalY, finalZ, intendedX, intendedZ, pushedOwners
                                    );
                                    newX = fallback.x;
                                    newZ = fallback.z;
                                    isGrounded = false;
                                }
                            } else {
                                const swept = sweepCharacterXZ(finalX, finalY, finalZ, newX, newZ, pushedOwners);
                                newX = swept.x;
                                newZ = swept.z;
                            }
                        }

                        finalX = newX;
                        finalZ = newZ;

                        characterYaw = Math.atan2(worldMoveX, worldMoveZ) * 180 / Math.PI;
                        characterEntity.setLocalEulerAngles(0, characterYaw, 0);
                    }

                    if (isGrounded && !isJumping) {
                        const newGroundY = groundedSweepY !== null
                            ? groundedSweepY
                            : lastGroundY;
                        lastGroundY = newGroundY;
                        if (Number.isFinite(newGroundY) &&
                            Math.abs(newGroundY - finalY) <= GROUND_MAX_STEP_DOWN + GROUND_SKIN &&
                            canSnapToGround(finalX, newGroundY, finalZ)) {
                            finalY = newGroundY;
                        } else {
                            isGrounded = false;
                        }
                    }

                    if (collisionEnabled && !positionLocked &&
                        isGrounded && !isJumping && Number.isFinite(lastGroundY) &&
                        Math.abs(finalY - lastGroundY) <= GROUND_SKIN + 1e-6 &&
                        !checkCollisionXZ(finalX, finalY, finalZ)) {
                        lastSafePose.x = finalX;
                        lastSafePose.y = finalY;
                        lastSafePose.z = finalZ;
                    }
                     
                    characterEntity.setPosition(finalX, finalY, finalZ);
                    updatePortalInteraction(finalX, finalY, finalZ);
                    dreamController?.updateExitTrigger(frameStartX, frameStartZ, finalX, finalZ);

                    
                    // ========== 更新角色碰撞体可视化位置 ==========
                    if (characterColliderVisible) {
                        const cfg = characterColliderConfig;
                        // 胶囊体以脚底为原点，可视化盒体应居中于身高中点
                        if (characterColliderEntity) {
                            characterColliderEntity.setPosition(
                                finalX + cfg.offsetX,
                                finalY + cfg.offsetY + cfg.height * 0.5,
                                finalZ + cfg.offsetZ
                            );
                        }
                        // 脚底位置标记
                        if (characterFootEntity) {
                            characterFootEntity.setPosition(finalX, finalY, finalZ);
                        }
                    }

                    // 物理脚底保持精确；相机只过滤一个体素宽度内的接地量化噪声。
                    const newCharPos = characterEntity.getPosition();
                    let cameraFootY = newCharPos.y;
                    if (isGrounded && !isJumping) {
                        cameraFootY = getStableCameraGroundY(newCharPos.y, dt);
                    } else {
                        cameraGroundCandidateY = null;
                        cameraGroundCandidateTime = 0;
                    }
                    const targetCameraY = cameraFootY + cameraEyeHeight;
                    if (!Number.isFinite(cameraSmoothY)) cameraSmoothY = targetCameraY;
                    const cameraSmoothTime = isGrounded && !isJumping ? 0.085 : 0.045;
                    const cameraAlpha = 1 - Math.exp(-dt / cameraSmoothTime);
                    const cameraDelta = (targetCameraY - cameraSmoothY) * cameraAlpha;
                    const maxCameraStep = (isGrounded && !isJumping ? 2.5 : 8.0) * dt;
                    cameraSmoothY += pc.math.clamp(cameraDelta, -maxCameraStep, maxCameraStep);
                    camera.setPosition(newCharPos.x, cameraSmoothY, newCharPos.z);
                    camera.setLocalEulerAngles(cameraPitch, cameraYaw, 0);
                    if (!window.EndlessDreamGameShell?.isPaused?.()) {
                        dreamController?.update(dt);
                    }
                    
                    // Keep diagnostics out of the production path and avoid rebuilding
                    // hidden DOM every frame while profiling with ?dev=1.
                    if (devMode && debugPanel.style.display !== 'none') {
                        debugUpdateAccumulator += dt;
                        if (debugUpdateAccumulator >= 0.2) {
                            debugUpdateAccumulator %= 0.2;
                            debugPanel.innerHTML = `
                                视角: 第一人称<br>
                                位置: (${newCharPos.x.toFixed(2)}, ${newCharPos.y.toFixed(2)}, ${newCharPos.z.toFixed(2)})<br>
                                重力: ${isGrounded ? '✅着地' : '⬇️空中'} | 速度Y: ${velocityY.toFixed(2)} | 跳跃: ${isJumping ? '是' : '否'} | 🔒锁定: ${positionLocked ? '是' : '否'}<br>
                                地面高度: ${Number.isFinite(lastGroundY) ? lastGroundY.toFixed(2) : '无'}<br>
                                碰撞: ${collisionEnabled ? '开' : '关'} | 体素${voxelCollision ? `✅${voxelCollision.res}m/深${voxelCollision.treeDepth}` : '❌未加载'} | 道具三角${propCollisionTriangles.length}<br>
                                🟢碰撞网格: ${collisionMeshVisible ? '显示' : '隐藏'} | 🔵高斯: ${splatVisible ? '显示' : '隐藏'}
                            `;
                        }
                    } else {
                        debugUpdateAccumulator = 0;
                    }
                });

                loadingEl.style.display = 'none';
                debugPanel.style.display = 'none';
                firstPersonHud?.classList.add('is-active');
                firstPersonHud?.setAttribute('aria-hidden', 'false');
                dreamController = window.EndlessDream.createController({
                    app,
                    camera,
                    characterEntity,
                    catEntity: blackCatEntity,
                    catModel: blackCatModel,
                    resumeSource,
                    exitDoor: SCENE_CONFIG.exitDoor,
                    getLook: () => ({ yaw: cameraYaw, pitch: cameraPitch }),
                    setLook: (yaw, pitch) => {
                        cameraYaw = yaw;
                        cameraPitch = pitch;
                    },
                    onInputLockChange: () => {
                        clearGameplayKeys();
                        syncPointerLockPrompt();
                    },
                    getGroundY: (x, z, currentY) => getContinuousGroundY(x, currentY, z)
                });
                window.__endlessDreamController = dreamController;

                if (devMode) {
                    const getMainRoomDebugState = () => {
                        const position = characterEntity.getPosition();
                        return {
                            playerPosition: [position.x, position.y, position.z],
                            nearbyPortalKind,
                            promptVisible: portalPrompt?.classList.contains('is-visible') || false,
                            promptText: portalPromptText?.textContent || '',
                            portals: {
                                mirror: SCENE_CONFIG.mirror,
                                sunflower: SCENE_CONFIG.sunflower
                            }
                        };
                    };
                    const mainRoomDebug = Object.freeze({
                        getInteractionState: getMainRoomDebugState,
                        setPlayerPose: (x, y, z) => {
                            if (![x, y, z].every(Number.isFinite)) {
                                throw new TypeError('setPlayerPose requires finite x, y and z values');
                            }
                            clearGameplayKeys();
                            characterEntity.setPosition(x, y, z);
                            lastSafePose.x = x;
                            lastSafePose.y = y;
                            lastSafePose.z = z;
                            lastGroundY = y;
                            cameraSmoothY = y + cameraEyeHeight;
                            velocityY = 0;
                            isGrounded = true;
                            isJumping = false;
                            updatePortalInteraction(x, y, z);
                            return getMainRoomDebugState();
                        }
                    });
                    window.__mainRoomDebug = mainRoomDebug;
                    app.on('destroy', () => {
                        if (window.__mainRoomDebug === mainRoomDebug) {
                            delete window.__mainRoomDebug;
                        }
                    });
                }

                syncPointerLockPrompt();
                document.getElementById('record-btn').style.display = devMode ? 'block' : 'none';
                canvas.focus();
                dreamController.start();

                console.log('✅ 墨雨栖第一人称场景加载完成！');
                console.log('📝 操作说明:');
                console.log('  鼠标 - 环顾');
                console.log('  WASD/方向键 - 移动');
                console.log('  Shift 按住 - 奔跑');
                console.log('  空格键 - 跳跃（可以跳到碰撞体上）');
                console.log('  E - 靠近镜子时进入逐光温室');
                console.log('  E - 靠近向日葵时进入倒置房间');
                console.log('  1 - 切换碰撞网格可视化');
                console.log('  2 - 切换高斯场景可视化');
                console.log('  3 - 切换坐标轴可视化');
                console.log('  4 - 切换角色碰撞体可视化');
                console.log('  C - 开关碰撞检测');
                console.log('  P - 显示调试面板');
                console.log('  L - 锁定位置（悬浮）');
                console.log('  Alt - 打开/关闭摆放面板');
                console.log('  跳跃落下踩踏摆放物可消灭，并小幅反弹');
                console.log('');
                if (voxelCollision) {
                    console.log('🧱 场景碰撞：PlayCanvas splat-transform 体素八叉树');
                    console.log(`   ${voxelCollision.describe()}`);
                    console.log(`   数据文件：${SCENE_CONFIG.voxelFile}`);
